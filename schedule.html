<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Team Schedule &mdash; IPX</title>
  <link rel="stylesheet" href="css/common.css?v=2.2.7" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 1.5vh 2vw;
      background: var(--bg-gradient);
      color: var(--text-main);
      overflow-x: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1.5vh;
      border-bottom: 1px solid var(--card-border);
      flex-wrap: wrap;
      gap: 1vh;
    }

    .header-left h1 {
      font-size: clamp(1.6rem, 2.2vw, 2.8rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 0.6vw;
      flex-wrap: wrap;
    }

    .header-separator {
      color: var(--theme-accent);
      opacity: 0.7;
    }

    .header-badge {
      background: rgba(255, 214, 10, 0.15);
      border: 1px solid rgba(255, 214, 10, 0.4);
      color: var(--theme-accent);
      font-size: clamp(0.85rem, 1.0vw, 1.2rem);
      font-weight: 700;
      padding: 0.4vh 1vw;
      border-radius: 999px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.8vw;
    }

    .btn-action {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-sub);
      text-decoration: none;
      font-size: clamp(0.85rem, 0.95vw, 1.15rem);
      font-weight: 600;
      padding: 0.6vh 1.2vw;
      border-radius: 8px;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.4vw;
      cursor: pointer;
    }

    .btn-action:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
      color: #ffffff;
      transform: translateY(-1px);
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2vh;
      margin-top: 1.8vh;
    }

    /* Stats Overview Grid */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 1vw;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.2vh 1.2vw;
      display: flex;
      align-items: center;
      gap: 1vw;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .stat-chip {
      width: 14px;
      height: 38px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .stat-info {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .stat-name {
      font-size: clamp(1rem, 1.1vw, 1.35rem);
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stat-hours {
      font-size: clamp(0.85rem, 0.95vw, 1.15rem);
      color: var(--text-muted);
      font-weight: 500;
    }

    .stat-hours strong {
      color: var(--theme-accent);
      font-weight: 700;
    }

    /* Chart Container */
    .schedule-wrapper {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.5vh 1.5vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      overflow: hidden;
    }

    .schedule-img-container {
      width: 100%;
      overflow-x: auto;
      text-align: center;
      -webkit-overflow-scrolling: touch;
    }

    .schedule-img {
      max-width: 100%;
      height: auto;
      display: inline-block;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: clamp(0.8rem, 0.85vw, 1.05rem);
      color: var(--text-muted);
      padding-top: 1.5vh;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      margin-top: 2vh;
      flex-wrap: wrap;
      gap: 1vh;
    }

    .footer-left {
      display: flex;
      align-items: center;
      gap: 0.8vw;
    }

    @media (max-width: 768px) {
      .schedule-img {
        min-width: 800px;
      }
    }
  </style>
</head>
<body class="page-schedule theme-apple">
  <header>
    <div class="header-left">
      <h1 id="header-title">
        <span>Welcome to IPX!</span>
        <span class="header-separator">&ndash;</span>
        <span>Team Schedule</span>
      </h1>
      <span class="header-badge">Oct 19 &ndash; Oct 25, 2026</span>
    </div>

    <div class="header-actions">
      <a href="team_schedule_gantt.png" target="_blank" class="btn-action" title="View Full Resolution">
        <span>&#x2922;</span> Full Size
      </a>
      <a href="team_schedule_gantt.png" download="IPX_Team_Schedule_Oct19-25.png" class="btn-action" title="Download Image">
        <span>&#x21E9;</span> Download
      </a>
      <a href="https://ipxbk.com" class="btn-action" title="Back to Court Sessions">
        <span>&#x2190;</span> Sessions
      </a>
    </div>
  </header>

  <main class="main-content">
    <section class="stats-bar">
      <div class="stat-card">
        <div class="stat-chip" style="background-color: #1E5F8A;"></div>
        <div class="stat-info">
          <span class="stat-name">Carlos</span>
          <span class="stat-hours"><strong>37.0h</strong> &bull; 5 shifts</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-chip" style="background-color: #D96B27;"></div>
        <div class="stat-info">
          <span class="stat-name">Carl</span>
          <span class="stat-hours"><strong>19.0h</strong> &bull; 2 shifts</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-chip" style="background-color: #2E7D32;"></div>
        <div class="stat-info">
          <span class="stat-name">Kadeem</span>
          <span class="stat-hours"><strong>19.5h</strong> &bull; 3 shifts</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-chip" style="background-color: #7B1FA2;"></div>
        <div class="stat-info">
          <span class="stat-name">Nicole</span>
          <span class="stat-hours"><strong>20.5h</strong> &bull; 3 shifts</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-chip" style="background-color: #C2185B;"></div>
        <div class="stat-info">
          <span class="stat-name">Johnpaul</span>
          <span class="stat-hours"><strong>33.0h</strong> &bull; 6 shifts</span>
        </div>
      </div>
      <div class="stat-card" style="border-color: rgba(255, 214, 10, 0.35); background: rgba(255, 214, 10, 0.05);">
        <div class="stat-chip" style="background-color: var(--theme-accent);"></div>
        <div class="stat-info">
          <span class="stat-name" style="color: var(--theme-accent);">Total Team</span>
          <span class="stat-hours"><strong style="color: #ffffff;">129.0h</strong> &bull; 19 shifts</span>
        </div>
      </div>
    </section>

    <section class="schedule-wrapper">
      <div class="schedule-img-container">
        <img
          id="schedule-chart"
          src="team_schedule_gantt.png"
          alt="IPX Team Staff Schedule — Week of Oct 19 to Oct 25, 2026"
          class="schedule-img"
        />
      </div>
    </section>
  </main>

  <footer>
    <div class="footer-left">
      <span>IPX Court Schedule System</span>
      <span>&bull;</span>
      <span id="sync-indicator">Auto-refreshed</span>
    </div>
    <div class="footer-right">
      <span id="host-url-display">staff.ipxbk.com</span>
    </div>
  </footer>

  <script>
    const hostSpan = document.getElementById('host-url-display');
    if (hostSpan && window.location.host) {
      hostSpan.textContent = window.location.host;
    }

    const chartImg = document.getElementById('schedule-chart');
    if (chartImg) {
      chartImg.src = `team_schedule_gantt.png?v=${Date.now()}`;
    }

    setInterval(() => {
      if (chartImg) {
        chartImg.src = `team_schedule_gantt.png?v=${Date.now()}`;
      }
    }, 300000);
  </script>
</body>
</html>
