<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Event Choice Breakdown | IPX</title>
  <link rel="stylesheet" href="css/common.css?v=2.2.0" />
  <style>
    :root {
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.1);
      --color-adv-beg: #2ec4b6;
      --color-int: #3a86ff;
      --color-high-int: #8338ec;
      --color-adv: #ff006e;
      --color-default: var(--theme-accent, #00f0ff);
    }

    html {
      width: 100%;
      height: auto !important;
      overflow-x: hidden !important;
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch;
    }

    body.page-event-choices {
      width: 100% !important;
      height: auto !important;
      min-height: 100vh !important;
      overflow: visible !important;
      position: static !important;
    }

    body.page-event-choices {
      background-color: var(--bg-main, #0d1117);
      background-image: radial-gradient(circle at 50% 0%, #1c1c1e 0%, #121214 65%, #000000 100%);
      color: var(--text-main, #f0f6fc);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      margin: 0 !important;
      padding: 0 !important;
    }

    .event-page-container {
      max-width: 720px;
      margin: 0 auto;
      width: 100%;
      box-sizing: border-box;
      padding: 3vh 4vw 8vh 4vw;
      flex: 1 0 auto;
      display: flex;
      flex-direction: column;
    }

    /* Top Brand Bar */
    .brand-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2.5vh;
      padding-bottom: 1.5vh;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--theme-accent, #00f0ff);
    }

    .brand-meta {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.5);
    }

    /* Session Header Card */
    .event-hero {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 3vh 4vw;
      margin-bottom: 2.5vh;
      backdrop-filter: blur(12px);
    }

    .event-title {
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin: 0 0 1vh 0;
      color: #ffffff;
    }

    .event-time-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-size: clamp(1rem, 2vw, 1.25rem);
      color: rgba(255, 255, 255, 0.85);
      font-weight: 500;
    }

    .event-meta-badges {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.6rem;
      margin-top: 1.4vh;
    }

    .event-players-badge {
      display: inline-flex;
      align-items: center;
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.9);
      font-weight: 600;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 0.3rem 0.8rem;
      border-radius: 8px;
    }

    .event-courts {
      display: inline-flex;
      align-items: center;
      font-size: 0.95rem;
      color: var(--theme-accent, #00f0ff);
      font-weight: 600;
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid rgba(0, 240, 255, 0.2);
      padding: 0.3rem 0.8rem;
      border-radius: 8px;
    }

    /* Multi-Date Tabs */
    .date-selector-wrapper {
      margin-bottom: 2.5vh;
    }

    .date-selector-label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 0.8vh;
    }

    .date-tabs {
      display: flex;
      gap: 0.8rem;
      overflow-x: auto;
      padding-bottom: 0.5vh;
      scrollbar-width: none;
    }
    .date-tabs::-webkit-scrollbar { display: none; }

    .date-tab-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.8);
      padding: 0.6rem 1.1rem;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .date-tab-btn.is-active {
      background: var(--theme-accent, #00f0ff);
      border-color: var(--theme-accent, #00f0ff);
      color: #000000;
      box-shadow: 0 4px 16px rgba(0, 240, 255, 0.25);
    }

    /* Questions / Breakdown Section */
    .breakdown-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 3vh 4vw;
      margin-bottom: 2vh;
    }

    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 2.5vh;
      padding-bottom: 1.2vh;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .question-title {
      font-size: clamp(1.2rem, 2.5vw, 1.5rem);
      font-weight: 700;
      color: #ffffff;
      margin: 0;
    }

    .respondent-count {
      font-size: 0.95rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.6);
      background: rgba(255, 255, 255, 0.08);
      padding: 0.2rem 0.7rem;
      border-radius: 20px;
    }

    /* Choice Bar Item */
    .choice-item {
      margin-bottom: 2.2vh;
    }
    .choice-item:last-child {
      margin-bottom: 0;
    }

    .choice-labels {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.6vh;
    }

    .choice-name {
      font-size: clamp(1rem, 2vw, 1.15rem);
      font-weight: 600;
      color: #ffffff;
    }

    .choice-tally {
      font-size: clamp(0.95rem, 1.8vw, 1.1rem);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: rgba(255, 255, 255, 0.9);
    }

    .choice-bar-track {
      background: rgba(255, 255, 255, 0.08);
      height: 14px;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }

    .choice-bar-fill {
      height: 100%;
      border-radius: 8px;
      transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      background: var(--color-default);
    }

    /* Registrant List Card */
    .registrants-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 3vh 4vw;
      margin-top: 2vh;
      margin-bottom: 2vh;
    }

    .registrant-group {
      margin-top: 2.2vh;
    }

    .registrant-group:first-of-type {
      margin-top: 0.5vh;
    }

    .registrant-group-header {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      font-size: 0.95rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 1vh;
    }

    .registrant-group-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .registrant-group-count {
      font-weight: 600;
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.88rem;
    }

    .registrants-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 0.8rem 1rem;
      margin-top: 1vh;
    }

    .registrant-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 0.45rem 0.75rem;
      font-size: 0.95rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.9);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .registrant-pill::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--pill-color, var(--theme-accent, #00f0ff));
      flex-shrink: 0;
    }

    /* Empty & Loading States */
    .empty-state {
      text-align: center;
      padding: 8vh 2vw;
      color: rgba(255, 255, 255, 0.6);
    }
    .empty-state h3 {
      font-size: 1.6rem;
      color: #ffffff;
      margin-bottom: 1vh;
    }

    /* Footer Meta */
    .page-footer {
      text-align: center;
      margin-top: auto;
      padding-top: 3vh;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.6rem;
    }
  </style>
</head>
<body class="page-event-choices">
  <div class="event-page-container">
    <main id="main-content">
      <div class="empty-state">
        <h3>Loading Breakdown...</h3>
        <p>Fetching the latest registrations from CourtReserve.</p>
      </div>
    </main>

    <footer class="page-footer">
      <span id="footer-event-info">Event #--</span>
      <span>&bull;</span>
      <span id="sync-time">Sync: --</span>
    </footer>
  </div>

  <script src="js/common.js?v=2.3.6"></script>
  <script>
    function cleanEventTitle(rawTitle) {
      if (!rawTitle) return '';
      return String(rawTitle)
        .replace(/^\s*Play\s*(?:til|until|till)\s*1(?::00)?\s*am\s*[-–—|:]*\s*/gi, '')
        .replace(/\s*\(\s*Play\s*(?:til|until|till)\s*1(?::00)?\s*am\s*\)/gi, '')
        .replace(/\s*[-–—|/]\s*Play\s*(?:til|until|till)\s*1(?::00)?\s*am\b/gi, '')
        .replace(/\bPlay\s*(?:til|until|till)\s*1(?::00)?\s*am\b/gi, '')
        .replace(/\s*[-–—|/:]\s*$/g, '')
        .replace(/^\s*[-–—|/:]\s*/g, '')
        .trim();
    }
    const eventParams = new URLSearchParams(window.location.search);
    let eventIdParam = eventParams.get('id') || eventParams.get('eventId') || eventParams.get('e');

    // If no named param, check if the query string itself is the ID (e.g. ?2160558 or ?2160558&)
    if (!eventIdParam && window.location.search) {
      const rawQuery = window.location.search.replace(/^\?/, '').split('&')[0];
      if (/^\d+$/.test(rawQuery)) {
        eventIdParam = rawQuery;
      }
    }

    let cachedEventData = null;
    let selectedSessionIndex = 0;

    function formatEventTimeWindow(startIso, endIso) {
      if (!startIso) return { dateStr: 'Upcoming Session', timeStr: 'Time TBD' };
      const s = new Date(startIso);
      let e = endIso ? new Date(endIso) : null;
      if (e && ((e.getHours() === 23 && e.getMinutes() === 59) || /23:59|11:59\s*pm/i.test(String(endIso || '')))) {
        e = new Date(e.getTime() + 61 * 60 * 1000);
      }
      
      const timeOpts = { hour: 'numeric', minute: '2-digit' };
      const sStr = isNaN(s.getTime()) ? '' : s.toLocaleTimeString([], timeOpts);
      const eStr = e && !isNaN(e.getTime()) ? e.toLocaleTimeString([], timeOpts) : '';
      
      const dateOpts = { weekday: 'short', month: 'short', day: 'numeric' };
      const dateStr = isNaN(s.getTime()) ? 'Upcoming' : s.toLocaleDateString([], dateOpts);
      
      return {
        dateStr,
        timeStr: eStr ? `${sStr} – ${eStr}` : (sStr || 'Time TBD')
      };
    }

    function getLevelColor(choiceName) {
      const lower = choiceName.toLowerCase();
      if (lower.includes('adv') && lower.includes('beg')) return 'var(--color-adv-beg)';
      if (lower.includes('high int')) return 'var(--color-high-int)';
      if (lower.includes('intermediate')) return 'var(--color-int)';
      if (lower.includes('advanced')) return 'var(--color-adv)';
      return 'var(--color-default)';
    }

    function renderSession(session, allSessions) {
      const main = document.getElementById('main-content');
      const timeInfo = formatEventTimeWindow(session.startTime, session.endTime);

      let dateTabsHtml = '';
      if (allSessions && allSessions.length > 1) {
        dateTabsHtml = `
          <div class="date-selector-wrapper">
            <div class="date-selector-label">Upcoming Dates (Next 10 Days)</div>
            <div class="date-tabs">
              ${allSessions.map((s, idx) => {
                const dt = formatEventTimeWindow(s.startTime, s.endTime);
                const active = idx === selectedSessionIndex ? 'is-active' : '';
                return `
                  <button class="date-tab-btn ${active}" onclick="switchSession(${idx})">
                    ${dt.dateStr}
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      let courtsHtml = '';
      if (session.courts && session.courts.length > 0) {
        const cleanCourts = session.courts
          .map(c => String(c).replace(/\s*\([^)]*\)/g, '').replace(/^Court\s*/i, '').trim())
          .filter(Boolean);
        if (cleanCourts.length > 0) {
          courtsHtml = `<div class="event-courts">Court${cleanCourts.length > 1 ? 's' : ''} ${cleanCourts.join(', ')}</div>`;
        }
      }
      if (!courtsHtml) {
        courtsHtml = `<div class="event-courts" style="color: rgba(255, 255, 255, 0.65); background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.12);">Courts Pending</div>`;
      }

      let questionsHtml = '';
      const relevantQuestions = (session.questions || []).filter(q => {
        const qLower = q.question.toLowerCase();
        const isIgnored = ['emergency', 'contact', 'phone', 'zip', 'wellhub', 'address', 'waiver', 'relationship', 'member id'].some(term => qLower.includes(term));
        return !isIgnored && q.choices && q.choices.length > 0;
      });

      let primaryQuestionChoices = null;

      if (relevantQuestions.length > 0) {
        questionsHtml = relevantQuestions.map((q, qIdx) => {
          const isLevelQ = q.question.toLowerCase().includes('level') || q.question.toLowerCase().includes('self-rate');
          let validChoices = [];

          if (isLevelQ) {
            const standardLevels = ['Advanced Beginner', 'Intermediate', 'High Intermediate', 'Advanced'];
            const countMap = {};
            const playersMap = {};
            standardLevels.forEach(lvl => {
              countMap[lvl] = 0;
              playersMap[lvl] = [];
            });

            (q.choices || []).forEach(c => {
              const matched = standardLevels.find(lvl => lvl.toLowerCase() === c.choice.toLowerCase());
              if (matched) {
                countMap[matched] = c.count;
                playersMap[matched] = Array.isArray(c.players) ? c.players : [];
              }
            });

            validChoices = standardLevels.map(lvl => ({
              choice: lvl,
              count: countMap[lvl],
              players: playersMap[lvl]
            }));
          } else {
            validChoices = (q.choices || []).map(c => ({
              ...c,
              players: Array.isArray(c.players) ? c.players : []
            }));
          }

          if (qIdx === 0 || isLevelQ) {
            primaryQuestionChoices = validChoices;
          }

          // Re-calculate percentages based on valid choices
          const validTotal = validChoices.reduce((sum, c) => sum + c.count, 0);

          // Proportional Court Allocation & IPX Pod Rules
          const cleanCourt = typeof cleanCourtNumber === 'function' 
            ? cleanCourtNumber 
            : (c) => String(c).replace(/\s*\([^)]*\)/g, '').replace(/^Court\s*/i, '').trim();

          const isCourtExcluded = typeof isCourtExcludedFromAllocation === 'function'
            ? isCourtExcludedFromAllocation
            : (c) => {
                if (!c) return true;
                const cl = cleanCourt(c).toLowerCase();
                return cl === '13' || cl.includes('event space');
              };

          const cleanCourts = (session.courts || [])
            .map(cleanCourt)
            .filter(c => Boolean(c) && !isCourtExcluded(c))
            .sort((a, b) => (parseInt(a, 10) || 0) - (parseInt(b, 10) || 0));

          const courtLabelsByChoice = {};
          if (isLevelQ) {
            const countByLevel = {};
            validChoices.forEach(c => { countByLevel[c.choice] = c.count; });

            const advCount = countByLevel['Advanced'] || 0;
            const highIntCount = countByLevel['High Intermediate'] || 0;
            const advMerged = advCount > 0 && advCount <= 4 && highIntCount > 0;

            const advBegCount = countByLevel['Advanced Beginner'] || 0;
            const intCount = countByLevel['Intermediate'] || 0;
            const advBegMerged = advBegCount > 0 && advBegCount < 4 && intCount > 0;

            // 1. Check if server pre-computed courtAllocations are present in session
            let courtAlloc = session.courtAllocations;

            // 2. Fall back to shared allocateCourts engine if not pre-computed or dynamically modified
            if (!courtAlloc || Object.keys(courtAlloc).length === 0) {
              if (typeof allocateCourts === 'function' && cleanCourts.length > 0) {
                courtAlloc = allocateCourts(countByLevel, cleanCourts);
              }
            }

            const standardOrder = ['Advanced Beginner', 'Intermediate', 'High Intermediate', 'Advanced'];

            if (courtAlloc && Object.keys(courtAlloc).length > 0) {
              standardOrder.forEach(lvl => {
                const assigned = courtAlloc[lvl];
                if (lvl === 'Advanced' && advMerged) {
                  const targetCourts = courtAlloc['High Intermediate'];
                  if (targetCourts && targetCourts.length > 0) {
                    const courtsText = (targetCourts.length === 1 ? 'Court ' : 'Courts ') + targetCourts.join(', ');
                    courtLabelsByChoice[lvl] = `Merge w/ High Int (${courtsText})`;
                  } else {
                    courtLabelsByChoice[lvl] = 'Merge w/ High Int';
                  }
                } else if (lvl === 'Advanced Beginner' && advBegMerged) {
                  const targetCourts = courtAlloc['Intermediate'];
                  if (targetCourts && targetCourts.length > 0) {
                    const courtsText = (targetCourts.length === 1 ? 'Court ' : 'Courts ') + targetCourts.join(', ');
                    courtLabelsByChoice[lvl] = `Merge w/ Int (${courtsText})`;
                  } else {
                    courtLabelsByChoice[lvl] = 'Merge w/ Int';
                  }
                } else if (assigned && assigned.length > 0) {
                  courtLabelsByChoice[lvl] = (assigned.length === 1 ? 'Court ' : 'Courts ') + assigned.join(', ');
                } else {
                  courtLabelsByChoice[lvl] = '0 Courts';
                }
              });
            } else {
              // Fallback when cleanCourts is empty (e.g. courts not yet configured in CourtReserve)
              const effectiveCounts = { ...countByLevel };
              if (advMerged) {
                effectiveCounts['High Intermediate'] = (effectiveCounts['High Intermediate'] || 0) + advCount;
                effectiveCounts['Advanced'] = 0;
              }
              if (advBegMerged) {
                effectiveCounts['Intermediate'] = (effectiveCounts['Intermediate'] || 0) + advBegCount;
                effectiveCounts['Advanced Beginner'] = 0;
              }

              const activeLevels = standardOrder.filter(lvl => (effectiveCounts[lvl] || 0) > 0);
              const totalEffective = activeLevels.reduce((sum, lvl) => sum + effectiveCounts[lvl], 0);
              const totalCourtsAvailable = Math.max(1, Math.ceil(totalEffective / 6));

              if (totalEffective > 0 && totalCourtsAvailable > 0) {
                const quotas = {};
                const floors = {};
                activeLevels.forEach(lvl => {
                  quotas[lvl] = (effectiveCounts[lvl] / totalEffective) * totalCourtsAvailable;
                  floors[lvl] = Math.floor(quotas[lvl]);
                });

                let assignedSum = activeLevels.reduce((sum, lvl) => sum + floors[lvl], 0);
                const remainders = activeLevels.map(lvl => ({
                  level: lvl,
                  rem: quotas[lvl] - floors[lvl]
                })).sort((a, b) => b.rem - a.rem);

                for (let i = 0; i < (totalCourtsAvailable - assignedSum); i++) {
                  floors[remainders[i].level]++;
                }

                standardOrder.forEach(lvl => {
                  const numCourts = floors[lvl] || 0;
                  if (numCourts > 0) {
                    courtLabelsByChoice[lvl] = `${numCourts} ${numCourts === 1 ? 'Court' : 'Courts'}`;
                  } else if (lvl === 'Advanced' && advMerged) {
                    const hiNum = floors['High Intermediate'] || 0;
                    courtLabelsByChoice[lvl] = hiNum > 0 ? `Merge w/ High Int (${hiNum} Courts)` : 'Merge w/ High Int';
                  } else if (lvl === 'Advanced Beginner' && advBegMerged) {
                    const intNum = floors['Intermediate'] || 0;
                    courtLabelsByChoice[lvl] = intNum > 0 ? `Merge w/ Int (${intNum} Courts)` : 'Merge w/ Int';
                  } else {
                    courtLabelsByChoice[lvl] = '0 Courts';
                  }
                });
              } else {
                standardOrder.forEach(lvl => {
                  courtLabelsByChoice[lvl] = '0 Courts';
                });
              }
            }
          }

          const choicesHtml = validChoices.map(c => {
            const barColor = getLevelColor(c.choice);
            const pct = validTotal > 0 ? ((c.count / validTotal) * 100).toFixed(1) : 0;
            
            let courtsLabel = courtLabelsByChoice[c.choice];
            if (!courtsLabel) {
              const courtsNeeded = c.count > 0 ? Math.ceil(c.count / 6) : 0;
              courtsLabel = courtsNeeded > 0 
                ? `${courtsNeeded} ${courtsNeeded === 1 ? 'Court' : 'Courts'}` 
                : '0 Courts';
            }
            c.courtsLabel = courtsLabel;

            return `
              <div class="choice-item">
                <div class="choice-labels">
                  <span class="choice-name">${c.choice} (${c.count})</span>
                  <span class="choice-tally">${courtsLabel}</span>
                </div>
                <div class="choice-bar-track">
                  <div class="choice-bar-fill" style="width: ${pct}%; background: ${barColor};"></div>
                </div>
              </div>
            `;
          }).join('');

          let displayTitle = q.question;
          if (displayTitle.toLowerCase().includes('level') || displayTitle.toLowerCase().includes('self-rate')) {
            displayTitle = 'Selected Playing Levels';
          }

          return `
            <div class="breakdown-card">
              <div class="question-header">
                <h2 class="question-title">${displayTitle}</h2>
                <span class="respondent-count">${validTotal} Responses</span>
              </div>
              <div class="choices-container">
                ${choicesHtml}
              </div>
            </div>
          `;
        }).join('');
      } else {
        const titleLower = (cachedEventData.title || '').toLowerCase();
        const isChoiceOrLevelEvent = titleLower.includes('open play') || titleLower.includes('choice') || titleLower.includes('level') || titleLower.includes('afternoon') || titleLower.includes('lunch') || titleLower.includes('break') || titleLower.includes('drill');

        if (isChoiceOrLevelEvent && (session.totalRegistered || 0) === 0) {
          const standardLevels = ['Advanced Beginner', 'Intermediate', 'High Intermediate', 'Advanced'];
          const choicesHtml = standardLevels.map(lvl => {
            const barColor = getLevelColor(lvl);
            return `
              <div class="choice-item">
                <div class="choice-labels">
                  <span class="choice-name">${lvl} (0)</span>
                  <span class="choice-tally">0 Courts</span>
                </div>
                <div class="choice-bar-track">
                  <div class="choice-bar-fill" style="width: 0%; background: ${barColor};"></div>
                </div>
              </div>
            `;
          }).join('');

          questionsHtml = `
            <div class="breakdown-card">
              <div class="question-header">
                <h2 class="question-title">Selected Playing Levels</h2>
                <span class="respondent-count">0 Responses</span>
              </div>
              <div class="choices-container">
                ${choicesHtml}
              </div>
            </div>
          `;
        } else {
          const msg = (session.totalRegistered || 0) === 0
            ? 'No players have signed up yet for this session.'
            : `No custom choices recorded yet for this session (${session.totalRegistered} total players registered).`;
          questionsHtml = `
            <div class="breakdown-card" style="text-align: center; padding: 4vh 2vw;">
              <p style="color: rgba(255,255,255,0.7); margin: 0; font-size: 1.1rem;">
                ${msg}
              </p>
            </div>
          `;
        }
      }

      let registrantsHtml = '';
      const regList = session.registrants || [];
      if (regList.length > 0) {
        const hasGroupedPlayers = primaryQuestionChoices && primaryQuestionChoices.some(c => c.players && c.players.length > 0);
        let bodyHtml = '';

        if (hasGroupedPlayers) {
          const assignedCounts = {};
          const groupsHtml = [];

          primaryQuestionChoices.forEach(c => {
            const pList = c.players || [];
            pList.forEach(p => { assignedCounts[p] = (assignedCounts[p] || 0) + 1; });
            if (pList.length > 0) {
              const grpColor = getLevelColor(c.choice);
              const courtsBadge = c.courtsLabel && c.courtsLabel !== '0 Courts'
                ? `<span class="registrant-group-courts" style="margin-left: auto; font-size: 0.85rem; font-weight: 600; color: ${grpColor}; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.12); padding: 0.2rem 0.65rem; border-radius: 6px;">${c.courtsLabel}</span>`
                : '';

              groupsHtml.push(`
                <div class="registrant-group">
                  <div class="registrant-group-header">
                    <span class="registrant-group-dot" style="background: ${grpColor};"></span>
                    <span>${c.choice}</span>
                    <span class="registrant-group-count">(${pList.length})</span>
                    ${courtsBadge}
                  </div>
                  <div class="registrants-grid">
                    ${pList.map(name => `<div class="registrant-pill" style="--pill-color: ${grpColor};">${name}</div>`).join('')}
                  </div>
                </div>
              `);
            }
          });

          const remainingCounts = { ...assignedCounts };
          const unassignedPlayers = [];
          regList.forEach(name => {
            if (remainingCounts[name] > 0) {
              remainingCounts[name]--;
            } else {
              unassignedPlayers.push(name);
            }
          });

          if (unassignedPlayers.length > 0) {
            groupsHtml.push(`
              <div class="registrant-group">
                <div class="registrant-group-header">
                  <span class="registrant-group-dot" style="background: rgba(255,255,255,0.4);"></span>
                  <span>Unassigned</span>
                  <span class="registrant-group-count">(${unassignedPlayers.length})</span>
                </div>
                <div class="registrants-grid">
                  ${unassignedPlayers.map(name => `<div class="registrant-pill" style="--pill-color: rgba(255,255,255,0.4);">${name}</div>`).join('')}
                </div>
              </div>
            `);
          }

          bodyHtml = groupsHtml.join('');
        } else {
          bodyHtml = `
            <div class="registrants-grid">
              ${regList.map(name => `<div class="registrant-pill">${name}</div>`).join('')}
            </div>
          `;
        }

        registrantsHtml = `
          <div class="registrants-card">
            <div class="question-header">
              <h2 class="question-title">Registrants</h2>
              <span class="respondent-count">${regList.length} ${regList.length === 1 ? 'Player' : 'Players'}</span>
            </div>
            ${bodyHtml}
          </div>
        `;
      } else {
        registrantsHtml = `
          <div class="registrants-card">
            <div class="question-header">
              <h2 class="question-title">Registrants</h2>
              <span class="respondent-count">0 Players</span>
            </div>
            <div style="text-align: center; padding: 4vh 2vw; color: rgba(255, 255, 255, 0.45); font-size: 1.05rem;">
              No players have registered yet.
            </div>
          </div>
        `;
      }

      main.innerHTML = `
        ${dateTabsHtml}
        
        <div class="event-hero">
          <h1 class="event-title">${cleanEventTitle(cachedEventData.title)}</h1>
          <div class="event-time-badge">
            <span>${timeInfo.dateStr}</span>
            <span>&bull;</span>
            <span>${timeInfo.timeStr}</span>
          </div>
          <div class="event-meta-badges">
            <span class="event-players-badge">${(session.totalRegistered || 0)} ${(session.totalRegistered === 1) ? 'Player' : 'Players'} Registered</span>
            ${courtsHtml}
          </div>
        </div>

        ${questionsHtml}

        ${registrantsHtml}
      `;
    }

    function switchSession(idx) {
      selectedSessionIndex = idx;
      if (cachedEventData && cachedEventData.sessions && cachedEventData.sessions[idx]) {
        window.userSelectedStartTime = cachedEventData.sessions[idx].startTime;
        renderSession(cachedEventData.sessions[idx], cachedEventData.sessions);
      }
    }

    async function loadEventData() {
      const main = document.getElementById('main-content');
      if (!eventIdParam) {
        main.innerHTML = `
          <div class="empty-state">
            <h3>No Event Specified</h3>
            <p>Please include an Event ID in the URL, e.g. <code>?id=2162219</code></p>
          </div>
        `;
        return;
      }

      async function fetchEventChoices(dataUrl) {
        const cacheBust = `_t=${Date.now()}`;
        try {
          const res = await fetch(`https://ipx-sync-pinger.willkang71.workers.dev/api/event-choices?${cacheBust}`);
          if (res.ok) return await res.json();
        } catch (err) {
          console.warn("KV fetch failed for event choices:", err);
        }
        const fallback = await fetch(`${dataUrl}?${cacheBust}`);
        if (!fallback.ok) throw new Error('Data file not found. Sync may be in progress.');
        return await fallback.json();
      }

      async function fetchScheduleFallback(schedUrl) {
        const cacheBust = `_t=${Date.now()}`;
        try {
          const res = await fetch(`https://ipx-sync-pinger.willkang71.workers.dev/api/schedule?${cacheBust}`);
          if (res.ok) return await res.json();
        } catch (err) {
          console.warn("KV fetch failed for schedule fallback:", err);
        }
        const fallback = await fetch(`${schedUrl}?${cacheBust}`);
        if (fallback.ok) return await fallback.json();
        return null;
      }

      try {
        const dataUrl = window.location.pathname.includes('/e') ? '../data/event-choices.json' : 'data/event-choices.json';
        const data = await fetchEventChoices(dataUrl);
        const eventInfoEl = document.getElementById('footer-event-info');
        if (eventInfoEl && eventIdParam) {
          eventInfoEl.textContent = `Event #${eventIdParam}`;
        }
        if (data.lastUpdated) {
          const syncDate = new Date(data.lastUpdated);
          const syncEl = document.getElementById('sync-time');
          if (syncEl) syncEl.textContent = `Sync: ${syncDate.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`;
        }

        let eventData = data.events ? data.events[String(eventIdParam).trim()] : null;

        if (!eventData || !eventData.sessions || eventData.sessions.length === 0) {
          // Fallback 1: check schedule.json
          try {
            const schedUrl = window.location.pathname.includes('/e') ? '../data/schedule.json' : 'data/schedule.json';
            const schedData = await fetchScheduleFallback(schedUrl);
            if (schedData) {
              const matchedEvents = (schedData.events || []).filter(e => {
                const eIdStr = String(e.eventId || '').split('_')[0].trim();
                return eIdStr === String(eventIdParam).trim();
              });
              if (matchedEvents.length > 0) {
                const first = matchedEvents[0];
                const courts = Array.from(new Set(matchedEvents.flatMap(e => e.courts || [])));
                eventData = {
                  eventId: String(eventIdParam).trim(),
                  title: cleanEventTitle(first.title || 'Event'),
                  sessions: [{
                    startTime: first.startTime,
                    endTime: first.endTime,
                    courts: courts,
                    totalRegistered: 0,
                    questions: [],
                    registrants: []
                  }]
                };
              }
            }
          } catch (e) {
            console.warn('Schedule fallback check failed:', e);
          }
        }

        // Fallback 2: If event was not found in either data file (e.g. newly created event in CourtReserve before signups or sync)
        // Synthesize a normally formatted page with event info so the page never displays a broken "Event not found" state.
        if (!eventData || !eventData.sessions || eventData.sessions.length === 0) {
          const customTitle = eventParams.get('title') || eventParams.get('name') || `Event #${eventIdParam}`;
          const customStart = eventParams.get('start') || eventParams.get('time') || null;
          const customEnd = eventParams.get('end') || null;
          const customCourts = eventParams.get('courts') ? eventParams.get('courts').split(',').map(c => c.trim()) : [];

          eventData = {
            eventId: String(eventIdParam).trim(),
            title: cleanEventTitle(customTitle),
            sessions: [{
              startTime: customStart || new Date().toISOString(),
              endTime: customEnd || null,
              courts: customCourts,
              totalRegistered: 0,
              questions: [],
              registrants: []
            }]
          };
        }

        // Filter out sessions whose endTime has already passed (if upcoming sessions exist)
        const now = new Date();
        const activeOrUpcoming = eventData.sessions.filter(s => {
          let endDt = s.endTime ? new Date(s.endTime) : new Date(s.startTime);
          if (endDt && ((endDt.getHours() === 23 && endDt.getMinutes() === 59) || /23:59|11:59\s*pm/i.test(String(s.endTime || '')))) {
            endDt = new Date(endDt.getTime() + 61 * 60 * 1000);
          }
          return endDt > now;
        });
        if (activeOrUpcoming.length > 0) {
          eventData.sessions = activeOrUpcoming;
        }

        // Preserve user's selected date tab across 60s refreshes, otherwise default to earliest upcoming (0)
        if (window.userSelectedStartTime) {
          const foundIdx = eventData.sessions.findIndex(s => s.startTime === window.userSelectedStartTime);
          selectedSessionIndex = foundIdx >= 0 ? foundIdx : 0;
        } else if (selectedSessionIndex >= eventData.sessions.length) {
          selectedSessionIndex = 0;
        }

        cachedEventData = eventData;
        renderSession(eventData.sessions[selectedSessionIndex], eventData.sessions);

      } catch (err) {
        console.error(err);
        main.innerHTML = `
          <div class="empty-state">
            <h3>Breakdown Unavailable</h3>
            <p>${err.message || 'Unable to load event tallies at this time.'}</p>
          </div>
        `;
      }
    }

    loadEventData();
    // Auto-refresh every 60 seconds if page stays open
    setInterval(loadEventData, 60000);
  </script>
</body>
</html>
