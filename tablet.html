<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Tablet Rosters</title>
  <link rel="stylesheet" href="css/common.css?v=2.2.0" />
  <style>
    header,
    footer {
      display: none !important;
    }
    body.page-tablet {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    body.page-tablet main {
      flex: 1;
      display: flex !important;
      padding: 2.5vh 2vw;
      overflow: hidden !important;
    }
    .tablet-card {
      flex: 1; /* Stretch to fill the whole main area */
      margin: 0;
      padding: 3vh 3vw !important;
    }
  </style>
</head>
<body class="page-tablet">
  <header>
    <div class="header-left">
      <h1 id="header-title">
        <span>Welcome to IPX!</span><span class="header-separator">&ndash;</span><span id="board-title-text">Tablet</span>
      </h1>
    </div>
  </header>

  <main id="roster-container">
    <div class="no-sessions">
      <h2>Loading Rosters...</h2>
    </div>
  </main>

  <script src="js/common.js?v=2.2.8"></script>
  <script>
    async function refreshDisplay() {
      try {
        const res = await fetch(`data/schedule.json?_t=${Date.now()}`);
        if (!res.ok) throw new Error("Schedule file not found");
        const data = await res.json();

        const now = new Date();
        const targetTime = new Date(now.getTime() + lookaheadMinutes * 60 * 1000);

        applyDynamicTheme(targetTime);

        const isRunningAtTarget = (startIso, endIso) => {
          if (!startIso || !endIso) return false;
          const s = new Date(startIso);
          let e = new Date(endIso);
          if (e.getHours() === 23 && e.getMinutes() === 59) {
            e = new Date(e.getTime() + 61 * 60 * 1000);
          }
          return s <= targetTime && e > targetTime;
        };

        const events = Array.isArray(data) ? data : (data.events || []);

        const sessions = [];
        const eventMap = {};

        events.forEach(e => {
          if (!isRunningAtTarget(e.startTime, e.endTime)) return;

          const rawName = (e.title || e.DivisionName || e.EventName || e.category || '');
          if (/\bRoad\b/i.test(rawName)) return;

          const key = `${e.eventId || e.EventId}_${e.startTime || e.StartTime}`;
          const courtNumbers = extractSortedCourts(e.courts || e.Courts);
          const queueInfo = e.paddleQueue || e.PaddleQueue || e.queueText || '';

          if (!eventMap[key]) {
            eventMap[key] = {
              title: cleanTitle(e.title || e.DivisionName || e.EventName || 'Event'),
              startTime: e.startTime || e.StartTime,
              endTime: e.endTime || e.EndTime,
              courts: new Set(courtNumbers),
              queueText: queueInfo,
              players: new Map()
            };
          } else {
            courtNumbers.forEach(c => eventMap[key].courts.add(c));
            if (queueInfo && !eventMap[key].queueText) {
              eventMap[key].queueText = queueInfo;
            }
          }

          let pName = e.playerName;
          if (!pName) {
            const f = e.FirstName || e.MemberFirstName || e.UserFirstName || '';
            const l = e.LastName || e.MemberLastName || e.UserLastName || '';
            if (f) {
              pName = `${f} ${l ? l.charAt(0) : ''}`.trim();
            } else if (e.MemberName) {
              pName = e.MemberName;
            }
          }

          if (pName) {
            const formattedName = toSentenceCase(pName);
            const isChecked = e.checkedIn === true || e.IsCheckedIn === true;
            const currentStatus = eventMap[key].players.get(formattedName);
            eventMap[key].players.set(formattedName, currentStatus || isChecked);
          }
        });

        // Tablet ID mapping for filtering sessions
        const urlParamsTablet = new URLSearchParams(window.location.search);
        let tabletId = (urlParamsTablet.get('id') || '').toLowerCase().trim();
        const queueOverride = urlParamsTablet.get('queue');
        const courtOverride = urlParamsTablet.get('court') || urlParamsTablet.get('rack');

        // Allow bare query shortcuts like ?rack4, ?court4, ?c4, ?4
        if (!tabletId && !queueOverride && !courtOverride && window.location.search) {
          const rawQ = window.location.search.replace(/^\?/, '').split('&')[0].toLowerCase().trim();
          if (rawQ) {
            tabletId = rawQ;
          }
        }

        const tabletMapping = {
          'rack1': 'court 1 paddle rack',
          'court1': 'court 1',
          'c1': 'court 1',
          '001': 'court 1',
          'willipad': 'court 1',
          'rack4': 'court 4',
          'table4': 'court 4 table',
          'court4': 'court 4',
          'c4': 'court 4',
          '004': 'court 4',
          '4': 'court 4',
          'rack6': 'court 6 paddle rack',
          'court6': 'court 6',
          'c6': 'court 6',
          'rack7': 'court 7 paddle rack',
          'table7': 'court 7 table',
          'court7': 'court 7',
          'c7': 'court 7',
          'xyz': 'court 7',
          'rack9': 'court 9 paddle rack',
          'table9': 'court 9 table',
          'court9': 'court 9',
          'c9': 'court 9',
          'rack10': 'court 10 paddle rack',
          'table10-l': 'court 10 table - left',
          'table10-r': 'court 10 table - right',
          'rack10-l': 'court 10 left paddle rack',
          'rack10-r': 'court 10 right paddle rack',
          'court10': 'court 10',
          'c10': 'court 10',
          'fff': 'court 10',
          'table11': 'court 11 table',
          'court11': 'court 11',
          'c11': 'court 11',
          'table12': 'court 12 table',
          'court12': 'court 12',
          'c12': 'court 12'
        };

        let targetFilter = (queueOverride || courtOverride || '').toLowerCase();
        if (!targetFilter && tabletId) {
          if (tabletMapping[tabletId]) {
            targetFilter = tabletMapping[tabletId].toLowerCase();
          } else {
            const match = tabletId.match(/(?:rack|table|court|c)?\s*(\d+)/i);
            if (match) {
              const num = match[1];
              if (tabletId.includes('table')) {
                targetFilter = `court ${num} table`;
              } else if (tabletId.includes('rack')) {
                targetFilter = `court ${num} paddle rack`;
              } else {
                targetFilter = `court ${num}`;
              }
            }
          }
        }
        
        // If still no filter (no URL param or unrecognized ID), default to rack7
        if (!targetFilter) {
          targetFilter = tabletMapping['rack7'];
        }
        
        window.currentTabletFilter = targetFilter;

        Object.values(eventMap).forEach(ev => {
          if (targetFilter) {
            const queueLoc = resolveQueueLocation(ev.courts, ev.queueText).toLowerCase();
            
            // Use word boundary to ensure "court 1" doesn't accidentally match "court 10"
            const regex = new RegExp(`\\b${targetFilter}\\b`, 'i');
            let matchesQueue = regex.test(queueLoc);
            
            const hasCourt = Array.from(ev.courts).some(c => c.toLowerCase() === targetFilter || 'court ' + c.toLowerCase() === targetFilter);
            
            // Flexible matching for court 4: if tablet is set to court 4 (or rack 4),
            // match any queue location at Court 4 (whether labeled "Table" or "Paddle Rack")
            if (targetFilter.includes('court 4') && queueLoc.includes('court 4')) {
              matchesQueue = true;
            }

            // Fallback for Court 10 tablets (table10-r, table10-l, rack10):
            // If the session is queued at Court 10 and not explicitly assigned to the opposite split, display it.
            let isCourt10Fallback = false;
            if (targetFilter.includes('court 10')) {
              const isCourt10Session = queueLoc.includes('court 10');
              const hasOppositeSplit = targetFilter.includes('right')
                ? queueLoc.includes('left')
                : (targetFilter.includes('left') ? queueLoc.includes('right') : false);

              if (isCourt10Session && !hasOppositeSplit) {
                isCourt10Fallback = true;
              }
            }

            if (!matchesQueue && !hasCourt && !isCourt10Fallback) {
              return; // Skip if it doesn't match the tablet's location
            }
          }

          // Court numbers only without 'Courts' or 'Court' prefix
          const courtArr = Array.from(ev.courts || []).sort((a, b) => (parseInt(a, 10) || 0) - (parseInt(b, 10) || 0));
          const courtsLabel = courtArr.length > 0 ? courtArr.join(', ') : 'TBD';

          const sortedPlayers = Array.from(ev.players.entries())
            .map(([name, checkedIn]) => ({ name, checkedIn }))
            .sort((a, b) => a.name.localeCompare(b.name));

          // Ensure queueText is fully resolved for display
          const resolvedQueue = resolveQueueLocation(ev.courts, ev.queueText);

          sessions.push({
            title: ev.title,
            courtsLabel: courtsLabel,
            queueText: resolvedQueue,
            courtCount: ev.courts ? ev.courts.size : 0,
            startTime: ev.startTime,
            endTime: ev.endTime,
            players: sortedPlayers
          });
        });

        const container = document.getElementById('roster-container');
        container.innerHTML = '';

        if (sessions.length === 0) {
          const rawParams = window.location.search ? window.location.search : 'None (default: rack7)';
          const syncTimeStr = data && data.lastUpdated 
            ? new Date(data.lastUpdated).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
            : '--';

          const numMatch = targetFilter.match(/\bcourt\s*(\d+)/i) || targetFilter.match(/\b(\d+)\b/);
          const courtNum = numMatch ? numMatch[1] : '';
          const courtQueueTitle = courtNum ? `Court ${courtNum} Queue - Inactive` : `Court Queue - Inactive`;

          container.className = '';
          container.innerHTML = `
            <div class="no-sessions" style="display: flex; flex-direction: column; justify-content: space-between; align-items: center; height: 100%; width: 100%; padding: 4vh 2vw 2vh 2vw; box-sizing: border-box;">
              <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 2vh;">
                <h2 style="font-size: clamp(3rem, 5.5vw, 6.5rem); font-weight: 800; color: #ffffff; letter-spacing: -0.02em; line-height: 1.15; margin: 0;">
                  ${courtQueueTitle}
                </h2>
                <p style="font-size: clamp(1.8rem, 2.8vw, 3.4rem); font-weight: 500; color: rgba(255, 255, 255, 0.7); margin: 0;">
                  See TVs for queue locations
                </p>
              </div>
              <div class="tablet-status-footer" style="font-size: clamp(1.1rem, 1.4vw, 1.8rem); color: rgba(255, 255, 255, 0.4); display: flex; align-items: center; justify-content: center; gap: 2vw; flex-wrap: wrap; border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 1.5vh; width: 100%;">
                <span><strong style="color: var(--text-sub);">URL:</strong> ${rawParams}</span>
                <span>&bull;</span>
                <span><strong style="color: var(--text-sub);">Filter:</strong> ${targetFilter}</span>
                <span>&bull;</span>
                <span><strong style="color: var(--text-sub);">Sync:</strong> ${syncTimeStr}</span>
              </div>
            </div>
          `;
          return;
        }

        sessions.sort((a, b) => {
          const keyA = (a.title || '').trim().substring(0, 3);
          const keyB = (b.title || '').trim().substring(0, 3);
          const numA = parseFloat(keyA);
          const numB = parseFloat(keyB);

          if (!isNaN(numA) && !isNaN(numB)) {
            if (numA !== numB) return numA - numB;
          } else {
            const strComp = keyA.localeCompare(keyB, undefined, { numeric: true, sensitivity: 'base' });
            if (strComp !== 0) return strComp;
          }

          return new Date(a.startTime) - new Date(b.startTime);
        });

        container.className = 'layout-tablet';
        container.style.display = 'flex';
        container.style.flexDirection = 'column';
        container.style.gap = '2vh';
        container.style.overflowY = 'auto';

        sessions.forEach(item => {
          const s = new Date(item.startTime);
          let e = new Date(item.endTime);
          if (e.getHours() === 23 && e.getMinutes() === 59) {
            e = new Date(e.getTime() + 61 * 60 * 1000);
          }

          const isNow = now >= s && now <= e;
          const count = item.players.length;

          // Responsive columns and font sizing to fit up to 30 names cleanly without clipping
          let dynCols = 1;
          let dynFontSize = '1.8rem';
          let dynRowGap = '0.8vh';
          let dynColGap = '1.8vw';

          if (count > 22) {
            dynCols = 2;
            dynFontSize = '1.15rem';
            dynRowGap = '0.3vh';
            dynColGap = '1.2vw';
          } else if (count > 14) {
            dynCols = 2;
            dynFontSize = '1.3rem';
            dynRowGap = '0.5vh';
            dynColGap = '1.5vw';
          } else if (count > 8) {
            dynCols = 2;
            dynFontSize = '1.5rem';
            dynRowGap = '0.6vh';
            dynColGap = '1.8vw';
          }

          const card = document.createElement('div');
          card.className = `roster-card tablet-card ${isNow ? 'is-now' : ''}`;
          
          card.style.display = 'flex';
          card.style.flexDirection = 'row';
          card.style.gap = '3vw';

          const listHtml = count > 0 
            ? item.players.map(p => `
                <div class="player-item ${p.checkedIn ? 'is-checked-in' : 'is-pending'}">
                  <span class="status-dot"></span>
                  <span class="player-name">${p.name}</span>
                </div>
              `).join('')
            : `<div class="player-empty">No registered players</div>`;

          const timeLabel = `${s.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })} - ${e.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`;
          const displayTitle = (item.title || '')
            .replace(/^(Lunch\s+Break|Afternoon)(\s+Open\s+Play)?\s*[-–—:]\s*/i, '')
            .trim() || item.title;

          card.innerHTML = `
            <div class="tablet-left" style="flex: 1.8; display: flex; flex-direction: column; justify-content: center; border-right: 1px solid rgba(255,255,255,0.1); padding-right: 2vw; gap: 1.5vh;">
              <div class="line-title" style="font-size: 5.5rem; line-height: 1.1; font-weight: 800; white-space: normal; margin-bottom: 0.5vh;">${displayTitle}</div>
              <div class="line-courts" style="font-size: 2.75rem; font-weight: 700; color: #fff;">${item.courtsLabel}</div>
              <div class="line-meta" style="font-size: 1.8rem; color: var(--text-sub); opacity: 0.9; display: flex; align-items: center; gap: 1.5vw; flex-wrap: wrap;">
                <span>${timeLabel}</span>
                ${item.queueText ? `<span class="paddle-queue" style="color: var(--theme-accent);">${item.queueText}</span>` : ''}
              </div>
              <div class="count-badge" style="width: fit-content; font-size: 1.6rem; margin-top: 0.5vh; padding: 0.4vh 1vw;">${count} ${count === 1 ? 'Player' : 'Players'}</div>
            </div>
            <div class="tablet-right" style="flex: 1.2; overflow-y: auto; padding-left: 1vw;">
              <div class="player-list" style="
                column-count: ${dynCols};
                column-gap: ${dynColGap};
                --roster-font-size: ${dynFontSize};
                --roster-row-gap: ${dynRowGap};
                --roster-col-gap: ${dynColGap};
                height: 100%;
              ">
                ${listHtml}
              </div>
            </div>
          `;

          container.appendChild(card);
        });

      } catch (err) {
        console.error("Error updating rosters display:", err);
      }
    }

    refreshDisplay();
    setInterval(refreshDisplay, 30000);
  </script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script src="js/mqtt-alerts.js?v=1.0.0"></script>
</body>
</html>
