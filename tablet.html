<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Tablet Rosters</title>
  <link rel="stylesheet" href="css/common.css?v=2.2.0" />
  <style>
    body.page-tablet main {
      overflow-y: auto !important;
      display: flex !important;
      padding-right: 1vw;
    }
    .tablet-card {
      padding: 3vh 3vw !important;
    }
  </style>
</head>
<body class="page-tablet">
  <header>
    <div class="header-left">
      <h1 id="header-title">
        <span>Welcome to IPX!</span><span class="header-separator">&ndash;</span><span id="board-title-text">Tablet</span>
      </h1>
    </div>
  </header>

  <main id="roster-container">
    <div class="no-sessions">
      <h2>Loading Rosters...</h2>
    </div>
  </main>

  <footer class="rosters-footer">
    <div class="footer-meta-grid">
      <span id="theme-pill">Theme: --</span>
      <span id="data-refresh-time">Data Sync: --</span>
      <span id="target-mode-pill">Target: --</span>
      <span id="page-refresh-time">Display: --</span>
    </div>
    <div class="footer-right">
      <div class="footer-countdown-container" id="countdown-box">
        <span class="countdown-label">Next session starts:</span>
        <span class="countdown-clock" id="transition-countdown">--:--</span>
      </div>
      <div class="footer-clock" id="live-clock">--:-- --</div>
    </div>
  </footer>

  <script src="js/common.js?v=2.2.0"></script>
  <script>
    async function refreshDisplay() {
      try {
        const res = await fetch(`data/schedule.json?_t=${Date.now()}`);
        if (!res.ok) throw new Error("Schedule file not found");
        const data = await res.json();

        const now = new Date();
        document.getElementById('page-refresh-time').textContent = `Display: ${now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true })}`;
        
        if (data.lastUpdated) {
          const syncDate = new Date(data.lastUpdated);
          document.getElementById('data-refresh-time').textContent = `Data Sync: ${syncDate.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: true })}`;
        }

        const targetTime = new Date(now.getTime() + lookaheadMinutes * 60 * 1000);
        const targetTimeString = targetTime.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: true });

        applyDynamicTheme(targetTime);

        document.getElementById('target-mode-pill').textContent = isPreview 
          ? `Target: ${targetTimeString}` 
          : 'Target: Live';

        const isRunningAtTarget = (startIso, endIso) => {
          if (!startIso || !endIso) return false;
          const s = new Date(startIso);
          let e = new Date(endIso);
          if (e.getHours() === 23 && e.getMinutes() === 59) {
            e = new Date(e.getTime() + 61 * 60 * 1000);
          }
          return s <= targetTime && e > targetTime;
        };

        const events = Array.isArray(data) ? data : (data.events || []);

        let closestFutureEpoch = null;
        events.forEach(e => {
          const rawName = (e.title || e.DivisionName || e.EventName || e.category || '');
          if (/\bRoad\b/i.test(rawName)) return;

          const s = new Date(e.startTime || e.StartTime).getTime();
          let endDt = new Date(e.endTime || e.EndTime);
          if (endDt.getHours() === 23 && endDt.getMinutes() === 59) {
            endDt = new Date(endDt.getTime() + 61 * 60 * 1000);
          }
          const endEpoch = endDt.getTime();

          [s, endEpoch].forEach(epoch => {
            if (epoch > now.getTime()) {
              if (closestFutureEpoch === null || epoch < closestFutureEpoch) {
                closestFutureEpoch = epoch;
              }
            }
          });
        });
        nextTransitionTargetEpoch = closestFutureEpoch;
        updateCountdown();

        const sessions = [];
        const eventMap = {};

        events.forEach(e => {
          if (!isRunningAtTarget(e.startTime, e.endTime)) return;

          const rawName = (e.title || e.DivisionName || e.EventName || e.category || '');
          if (/\bRoad\b/i.test(rawName)) return;

          const key = `${e.eventId || e.EventId}_${e.startTime || e.StartTime}`;
          const courtNumbers = extractSortedCourts(e.courts || e.Courts);
          const queueInfo = e.paddleQueue || e.PaddleQueue || e.queueText || '';

          if (!eventMap[key]) {
            eventMap[key] = {
              title: cleanTitle(e.title || e.DivisionName || e.EventName || 'Event'),
              startTime: e.startTime || e.StartTime,
              endTime: e.endTime || e.EndTime,
              courts: new Set(courtNumbers),
              queueText: queueInfo,
              players: new Map()
            };
          } else {
            courtNumbers.forEach(c => eventMap[key].courts.add(c));
            if (queueInfo && !eventMap[key].queueText) {
              eventMap[key].queueText = queueInfo;
            }
          }

          let pName = e.playerName;
          if (!pName) {
            const f = e.FirstName || e.MemberFirstName || e.UserFirstName || '';
            const l = e.LastName || e.MemberLastName || e.UserLastName || '';
            if (f) {
              pName = `${f} ${l ? l.charAt(0) : ''}`.trim();
            } else if (e.MemberName) {
              pName = e.MemberName;
            }
          }

          if (pName) {
            const formattedName = toSentenceCase(pName);
            const isChecked = e.checkedIn === true || e.IsCheckedIn === true;
            const currentStatus = eventMap[key].players.get(formattedName);
            eventMap[key].players.set(formattedName, currentStatus || isChecked);
          }
        });

        Object.values(eventMap).forEach(ev => {
          const courtsLabel = formatCourtsLabel(ev.courts, 'rosters');
          const sortedPlayers = Array.from(ev.players.entries())
            .map(([name, checkedIn]) => ({ name, checkedIn }))
            .sort((a, b) => a.name.localeCompare(b.name));

          sessions.push({
            title: ev.title,
            courtsLabel: courtsLabel,
            courtCount: ev.courts ? ev.courts.size : 0,
            startTime: ev.startTime,
            endTime: ev.endTime,
            players: sortedPlayers
          });
        });

        let bestWindowTag = '';
        if (sessions.length > 0) {
          const windowCounts = {};
          sessions.forEach(item => {
            const w = formatTimeWindow(item.startTime, item.endTime);
            windowCounts[w] = (windowCounts[w] || 0) + 1;
          });
          const bestWindow = Object.keys(windowCounts).reduce((a, b) => windowCounts[a] >= windowCounts[b] ? a : b);
          bestWindowTag = `<span class="header-window">(${bestWindow})</span>`;
        }

        const subtitleText = isPreview 
          ? `Rosters (${targetTimeString} Preview)` 
          : 'Rosters';

        const titleEl = document.getElementById('header-title');
        titleEl.innerHTML = `<span>Welcome to IPX!</span><span class="header-separator">&ndash;</span><span>${subtitleText}</span>${bestWindowTag}`;

        const container = document.getElementById('roster-container');
        container.innerHTML = '';

        if (sessions.length === 0) {
          container.className = '';
          container.innerHTML = `
            <div class="no-sessions">
              <h2>No Sessions Found</h2>
            </div>
          `;
          return;
        }

        sessions.sort((a, b) => {
          const keyA = (a.title || '').trim().substring(0, 3);
          const keyB = (b.title || '').trim().substring(0, 3);
          const numA = parseFloat(keyA);
          const numB = parseFloat(keyB);

          if (!isNaN(numA) && !isNaN(numB)) {
            if (numA !== numB) return numA - numB;
          } else {
            const strComp = keyA.localeCompare(keyB, undefined, { numeric: true, sensitivity: 'base' });
            if (strComp !== 0) return strComp;
          }

          return new Date(a.startTime) - new Date(b.startTime);
        });

        container.className = 'layout-tablet';
        container.style.display = 'flex';
        container.style.flexDirection = 'column';
        container.style.gap = '2vh';
        container.style.overflowY = 'auto'; // Allow scrolling on tablet

        const uniformCols = 3; // Roster cols
        const uniformFontSize = '1.4rem';
        const uniformRowGap = '1vh';
        const uniformColGap = '2vw';

        sessions.forEach(item => {
          const s = new Date(item.startTime);
          let e = new Date(item.endTime);
          if (e.getHours() === 23 && e.getMinutes() === 59) {
            e = new Date(e.getTime() + 61 * 60 * 1000);
          }

          const isNow = now >= s && now <= e;
          const count = item.players.length;

          const card = document.createElement('div');
          card.className = `roster-card tablet-card ${isNow ? 'is-now' : ''}`;
          
          card.style.display = 'flex';
          card.style.flexDirection = 'row';
          card.style.gap = '3vw';
          card.style.flex = 'none'; // Don't stretch indefinitely
          card.style.minHeight = '30vh';

          const listHtml = count > 0 
            ? item.players.map(p => `
                <div class="player-item ${p.checkedIn ? 'is-checked-in' : 'is-pending'}">
                  <span class="status-dot"></span>
                  <span class="player-name">${p.name}</span>
                </div>
              `).join('')
            : `<div class="player-empty">No registered players</div>`;

          const timeLabel = `${s.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })} - ${e.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`;

          card.innerHTML = `
            <div class="tablet-left" style="flex: 1; display: flex; flex-direction: column; justify-content: center; border-right: 1px solid rgba(255,255,255,0.1); padding-right: 2vw; gap: 1.5vh;">
              <div class="line-title" style="font-size: 2.8rem; line-height: 1.1; white-space: normal; -webkit-line-clamp: 3;">${item.title}</div>
              <div class="line-time" style="font-size: 1.6rem; color: var(--text-sub); opacity: 0.9;">${timeLabel}</div>
              <div class="line-courts" style="font-size: 2.2rem;">${item.courtsLabel}</div>
              ${item.queueText ? `<div class="paddle-queue" style="font-size: 1.6rem; color: var(--theme-accent);">${item.queueText}</div>` : ''}
              <div class="count-badge" style="width: fit-content; font-size: 1.4rem; margin-top: 1vh;">${count} ${count === 1 ? 'Player' : 'Players'}</div>
            </div>
            <div class="tablet-right" style="flex: 2; overflow-y: auto; padding-left: 1vw;">
              <div class="player-list" style="
                column-count: ${uniformCols};
                column-gap: ${uniformColGap};
                --roster-font-size: ${uniformFontSize};
                --roster-row-gap: ${uniformRowGap};
                --roster-col-gap: ${uniformColGap};
                height: 100%;
              ">
                ${listHtml}
              </div>
            </div>
          `;

          container.appendChild(card);
        });

      } catch (err) {
        console.error("Error updating rosters display:", err);
      }
    }

    refreshDisplay();
    setInterval(refreshDisplay, 30000);
  </script>
</body>
</html>
