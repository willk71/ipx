# Cloudflare Workers Builds project "ipx" (static boards + Pages Functions).
# Preview/deploy previously failed because the repo looked like Pages Functions
# with no Wrangler config, and auto-config cannot migrate functions/ yet.
name = "ipx"
main = "./dist/worker/index.js"
compatibility_date = "2024-11-01"
preview_urls = true
workers_dev = true
# Enable Worker Previews for non-production branches (Workers Builds PR checks).
previews = { }

# Compile functions/ (+ middleware) into a single Worker before deploy/preview.
[build]
command = "npx wrangler pages functions build ./functions --outdir=./dist/worker"

[assets]
directory = "."
binding = "ASSETS"
# Match Pages Functions behavior: run Worker (API + middleware) before static assets.
run_worker_first = true
