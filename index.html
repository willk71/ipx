<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Welcome to IPX! &ndash; Court Assignments</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 0%, #1c1c1e 0%, #121214 65%, #000000 100%);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.10);
      --card-border-active: rgba(255, 214, 10, 0.55);

      --theme-accent: #ffd60a;
      --text-main: #ffffff;
      --text-sub: #ebebf5;
      --text-muted: #8e8e93;

      --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    }

    /* --- 30 IPX THEMES --- */
    body.theme-tiffany      { --bg-gradient: radial-gradient(circle at 50% 0%, #003b36 0%, #001f1c 65%, #000000 100%); --theme-accent: #81d8d0; --card-border-active: rgba(129, 216, 208, 0.6); }
    body.theme-usopen       { --bg-gradient: radial-gradient(circle at 50% 0%, #0b2247 0%, #061329 65%, #000000 100%); --theme-accent: #c6e000; --card-border-active: rgba(198, 224, 0, 0.6); }
    body.theme-apple        { --bg-gradient: radial-gradient(circle at 50% 0%, #1c1c1e 0%, #121214 65%, #000000 100%); --theme-accent: #ffd60a; --card-border-active: rgba(255, 214, 10, 0.6); }
    body.theme-rolex        { --bg-gradient: radial-gradient(circle at 50% 0%, #002e1b 0%, #00170d 65%, #000000 100%); --theme-accent: #d4af37; --card-border-active: rgba(212, 175, 55, 0.6); }
    body.theme-porsche      { --bg-gradient: radial-gradient(circle at 50% 0%, #3a0007 0%, #1a0003 65%, #000000 100%); --theme-accent: #d5001c; --card-border-active: rgba(213, 0, 28, 0.6); }
    body.theme-rolandgarros { --bg-gradient: radial-gradient(circle at 50% 0%, #3d1b11 0%, #1f0b05 65%, #000000 100%); --theme-accent: #cb5a2b; --card-border-active: rgba(203, 90, 43, 0.6); }
    body.theme-ausopen      { --bg-gradient: radial-gradient(circle at 50% 0%, #003366 0%, #001833 65%, #000000 100%); --theme-accent: #0091df; --card-border-active: rgba(0, 145, 223, 0.6); }
    body.theme-vice         { --bg-gradient: radial-gradient(circle at 50% 0%, #2a0845 0%, #110022 65%, #000000 100%); --theme-accent: #ff007f; --card-border-active: rgba(255, 0, 127, 0.6); }
    body.theme-gulfracing   { --bg-gradient: radial-gradient(circle at 50% 0%, #1c2e3d 0%, #0b151e 65%, #000000 100%); --theme-accent: #ff7300; --card-border-active: rgba(255, 115, 0, 0.6); }
    body.theme-masters      { --bg-gradient: radial-gradient(circle at 50% 0%, #003322 0%, #001a11 65%, #000000 100%); --theme-accent: #006747; --card-border-active: rgba(0, 103, 71, 0.6); }
    body.theme-wimbledon    { --bg-gradient: radial-gradient(circle at 50% 0%, #122b18 0%, #07140a 65%, #000000 100%); --theme-accent: #582c83; --card-border-active: rgba(88, 44, 131, 0.6); }
    body.theme-monaco       { --bg-gradient: radial-gradient(circle at 50% 0%, #301928 0%, #170912 65%, #000000 100%); --theme-accent: #e6b800; --card-border-active: rgba(230, 184, 0, 0.6); }
    body.theme-cyberpunk    { --bg-gradient: radial-gradient(circle at 50% 0%, #051e2e 0%, #000a12 65%, #000000 100%); --theme-accent: #00ffcc; --card-border-active: rgba(0, 255, 204, 0.6); }
    body.theme-ferrari      { --bg-gradient: radial-gradient(circle at 50% 0%, #400000 0%, #1a0000 65%, #000000 100%); --theme-accent: #ff2800; --card-border-active: rgba(255, 40, 0, 0.6); }
    body.theme-glacier      { --bg-gradient: radial-gradient(circle at 50% 0%, #102636 0%, #06111a 65%, #000000 100%); --theme-accent: #76c7c0; --card-border-active: rgba(118, 199, 192, 0.6); }
    body.theme-desertclay   { --bg-gradient: radial-gradient(circle at 50% 0%, #381a10 0%, #190a05 65%, #000000 100%); --theme-accent: #e07a5f; --card-border-active: rgba(224, 122, 95, 0.6); }
    body.theme-astonmartin  { --bg-gradient: radial-gradient(circle at 50% 0%, #002824 0%, #001210 65%, #000000 100%); --theme-accent: #cedc00; --card-border-active: rgba(206, 220, 0, 0.6); }
    body.theme-solarflare   { --bg-gradient: radial-gradient(circle at 50% 0%, #381800 0%, #190800 65%, #000000 100%); --theme-accent: #ff8c00; --card-border-active: rgba(255, 140, 0, 0.6); }
    body.theme-stealth      { --bg-gradient: radial-gradient(circle at 50% 0%, #202024 0%, #101012 65%, #000000 100%); --theme-accent: #90a4ae; --card-border-active: rgba(144, 164, 174, 0.6); }
    body.theme-lakers       { --bg-gradient: radial-gradient(circle at 50% 0%, #2d1038 0%, #15001c 65%, #000000 100%); --theme-accent: #fdb927; --card-border-active: rgba(253, 185, 39, 0.6); }
    body.theme-yankees      { --bg-gradient: radial-gradient(circle at 50% 0%, #0a1728 0%, #030810 65%, #000000 100%); --theme-accent: #c4ced4; --card-border-active: rgba(196, 206, 212, 0.6); }
    body.theme-mets         { --bg-gradient: radial-gradient(circle at 50% 0%, #002047 0%, #000e20 65%, #000000 100%); --theme-accent: #ff5910; --card-border-active: rgba(255, 89, 16, 0.6); }
    body.theme-knicks       { --bg-gradient: radial-gradient(circle at 50% 0%, #001f42 0%, #000c1c 65%, #000000 100%); --theme-accent: #f58426; --card-border-active: rgba(245, 132, 38, 0.6); }
    body.theme-nets         { --bg-gradient: radial-gradient(circle at 50% 0%, #1f1f1f 0%, #0d0d0d 65%, #000000 100%); --theme-accent: #ffffff; --card-border-active: rgba(255, 255, 255, 0.6); }
    body.theme-liberty      { --bg-gradient: radial-gradient(circle at 50% 0%, #002826 0%, #001211 65%, #000000 100%); --theme-accent: #6eceb2; --card-border-active: rgba(110, 206, 178, 0.6); }
    body.theme-giants       { --bg-gradient: radial-gradient(circle at 50% 0%, #081d3d 0%, #020b17 65%, #000000 100%); --theme-accent: #ca122d; --card-border-active: rgba(202, 18, 45, 0.6); }
    body.theme-jets         { --bg-gradient: radial-gradient(circle at 50% 0%, #092a18 0%, #031209 65%, #000000 100%); --theme-accent: #ffffff; --card-border-active: rgba(255, 255, 255, 0.6); }
    body.theme-rangers      { --bg-gradient: radial-gradient(circle at 50% 0%, #00264d 0%, #001021 65%, #000000 100%); --theme-accent: #c8102e; --card-border-active: rgba(200, 16, 46, 0.6); }
    body.theme-islanders    { --bg-gradient: radial-gradient(circle at 50% 0%, #002d59 0%, #001429 65%, #000000 100%); --theme-accent: #f47d30; --card-border-active: rgba(244, 125, 48, 0.6); }
    body.theme-nycfc        { --bg-gradient: radial-gradient(circle at 50% 0%, #0a1c30 0%, #040c14 65%, #000000 100%); --theme-accent: #6cace4; --card-border-active: rgba(108, 172, 228, 0.6); }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-stack) !important;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 2.2vh 3vw 1.5vh 3vw;
      position: relative;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 1.2vh;
      flex-shrink: 0;
    }

    .header-left h1 {
      font-size: clamp(2rem, 3vw, 3.6rem);
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text-main);
      line-height: 1;
      white-space: nowrap;
      display: flex;
      align-items: baseline;
    }

    .header-separator {
      margin: 0 0.55em;
      color: var(--text-muted);
      font-weight: 300;
      opacity: 0.7;
    }

    .header-window {
      color: var(--theme-accent);
      font-weight: 600;
      margin-left: 0.4em;
    }

    main {
      flex: 1;
      display: grid;
      gap: 1.6vh 1.6vw;
      margin-top: 1.8vh;
      overflow: hidden;
      min-height: 0;
    }

    /* Grid Layout Counts */
    main.count-1 { grid-template-columns: 1fr; }
    main.count-2 { grid-template-columns: 1fr 1fr; }
    main.count-3 { grid-template-columns: 1fr 1fr 1fr; }
    main.count-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
    main.count-5, main.count-6 { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr; }

    /* Card Styling */
    .session-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-left: 10px solid var(--theme-accent);
      border-radius: 18px;
      padding: 2.5vh 2.2vw;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1vh;
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      min-height: 0;
      overflow: hidden;
    }

    .session-card.is-now {
      border-color: var(--card-border-active);
      box-shadow: 0 0 35px rgba(255, 214, 10, 0.15);
    }

    /* --- Strict Card Typography Scale --- */
    .session-title {
      font-size: clamp(2rem, 3.2vw, 4.4rem) !important;
      font-weight: 800 !important;
      line-height: 1.1 !important;
      color: var(--text-main) !important;
      letter-spacing: -0.01em !important;
      white-space: nowrap !important;
      overflow: hidden !important;
      text-overflow: ellipsis !important;
    }

    .session-courts {
      font-size: clamp(1.6rem, 2.4vw, 3.2rem) !important;
      font-weight: 700 !important;
      line-height: 1.15 !important;
      color: var(--theme-accent) !important;
      letter-spacing: -0.01em !important;
      white-space: nowrap !important;
      overflow: hidden !important;
      text-overflow: ellipsis !important;
    }

    .paddle-queue {
      font-size: clamp(1.1rem, 1.45vw, 1.85rem) !important;
      font-weight: 400 !important;
      line-height: 1.25 !important;
      color: var(--text-sub) !important;
      opacity: 0.8 !important;
      margin-top: 0.4vh !important;
      white-space: nowrap !important;
      overflow: hidden !important;
      text-overflow: ellipsis !important;
    }

    .no-sessions {
      grid-column: 1 / -1;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px dashed rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      color: var(--text-sub);
    }

    footer {
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 0.8vh;
      font-size: 0.8rem;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.4);
      font-variant-numeric: tabular-nums;
    }

    .footer-left {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .footer-right {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .footer-countdown-container {
      display: none;
      align-items: center;
      gap: 0.5rem;
      color: var(--theme-accent);
      font-weight: 600;
    }

    .footer-countdown-container.is-active {
      display: inline-flex;
    }

    .footer-clock {
      font-size: clamp(1.8rem, 2.4vw, 3rem);
      font-weight: 300;
      color: var(--theme-accent);
      letter-spacing: -0.03em;
      line-height: 1;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <h1 id="header-title">
        <span>Welcome to IPX!</span><span class="header-separator">&ndash;</span><span id="board-title-text">Sessions</span>
      </h1>
    </div>
  </header>

  <main id="session-container">
    <div class="no-sessions">
      <h2>Loading Sessions...</h2>
    </div>
  </main>

  <footer>
    <div class="footer-left">
      <span id="theme-pill">Theme: --</span>
      <span>&bull;</span>
      <span id="target-mode-pill">Target: --</span>
      <span>&bull;</span>
      <span id="data-refresh-time">Data Sync: --</span>
      <span>&bull;</span>
      <span id="page-refresh-time">Display Updated: --</span>
    </div>
    
    <div class="footer-right">
      <div class="footer-countdown-container" id="countdown-box">
        <span class="countdown-label">Current Sessions Ends/Next Sessions Starts:</span>
        <span class="countdown-clock" id="transition-countdown">--:--</span>
      </div>
      <div class="footer-clock" id="live-clock">--:-- --</div>
    </div>
  </footer>

  <script>
    // --- Embedded Shared Helpers ---
    function toSentenceCase(str) {
      if (!str) return '';
      return String(str).replace(/([^\W_]+[^\s-]*) */g, (txt) => {
        return txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase();
      }).trim();
    }

    function cleanCourtName(rawName) {
      if (!rawName) return '';
      return String(rawName)
        .replace(/\s*\(\s*Livestreaming\s*\)/gi, '')
        .replace(/\s*\(\s*Streaming\s*\)/gi, '')
        .replace(/^Court\s*/i, '')
        .trim();
    }

    function extractSortedCourts(courtsRaw) {
      if (!courtsRaw) return [];
      const list = Array.isArray(courtsRaw) ? courtsRaw : [courtsRaw];
      return list
        .map(c => cleanCourtName(c && c.CourtName ? c.CourtName : c))
        .filter(Boolean)
        .sort((a, b) => (parseInt(a, 10) || a) - (parseInt(b, 10) || b));
    }

    function formatCourtsLabel(courts, mode = 'index') {
      const arr = Array.isArray(courts) ? courts : Array.from(courts || []);
      if (mode === 'index') {
        return arr.length > 0 ? `on ${arr.join(' ')}` : 'on TBD';
      }
      if (arr.length === 0) return 'Court TBD';
      const prefix = arr.length === 1 ? 'Court' : 'Courts';
      return `${prefix} ${arr.join(', ')}`;
    }

    function resolveQueueLocation(courtsSet, customText) {
      if (customText) return customText;
      if (!courtsSet || courtsSet.size === 0) return '';

      const nums = Array.from(courtsSet).map(n => parseInt(n, 10)).filter(n => !isNaN(n));
      if (nums.length === 0) return '';

      if (courtsSet.has('7') || nums.some(n => n >= 7 && n <= 9)) {
        return 'queue at Court 7 paddle rack';
      }
      if (nums.some(n => n >= 1 && n <= 3)) {
        return 'queue at Court 1 paddle rack';
      }
      if (nums.some(n => n >= 4 && n <= 6)) {
        return 'queue at Court 4 paddle rack';
      }
      if (nums.some(n => n >= 10)) {
        return 'queue at Court 10 paddle rack';
      }

      const minCourt = Math.min(...nums);
      return `queue at Court ${minCourt} paddle rack`;
    }

    function cleanTitle(rawTitle) {
      if (!rawTitle) return '';
      let firstSegment = String(rawTitle).split('|')[0].trim();

      firstSegment = firstSegment.replace(/Pickleball\s+for\s+Parkinson'?s/gi, 'P4P');
      firstSegment = firstSegment.replace(/[()]/g, '');
      firstSegment = firstSegment
        .replace(/\bSessions?\b/gi, '')
        .replace(/\bOpen\s*Play\b/gi, '')
        .replace(/\bPrime\s*Time\b/gi, '');

      firstSegment = firstSegment.replace(/[-–—/,\s]+$/, '').replace(/\s{2,}/g, ' ').trim();
      firstSegment = firstSegment.replace(/(\d+(?:\.\d+)?)\s*[-–—]\s*(\d+(?:\.\d+)?)/g, '$1 \u2013 $2');

      let formatted = toSentenceCase(firstSegment);
      return formatted.replace(/\bP4p\b/gi, 'P4P');
    }

    function formatTime(isoString, isEndTime = false) {
      if (!isoString) return '';
      const d = new Date(isoString);
      if (isEndTime && d.getHours() === 23 && d.getMinutes() === 59) {
        return '1:00 AM';
      }
      return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: true });
    }

    function formatTimeWindow(startIso, endIso) {
      if (!startIso || !endIso) return '';
      const t1 = formatTime(startIso, false);
      const t2 = formatTime(endIso, true);
      const parts1 = t1.split(' ');
      const parts2 = t2.split(' ');
      if (parts1.length === 2 && parts2.length === 2 && parts1[1] === parts2[1]) {
        return `${parts1[0]} \u2013 ${t2}`;
      }
      return `${t1} \u2013 ${t2}`;
    }

    // --- State and URL Controls ---
    const urlParams = new URLSearchParams(window.location.search);
    const hasExplicitAhead = urlParams.has('ahead');
    const isNamed60 = window.location.pathname.includes('60');
    const defaultAhead = isNamed60 ? '60' : '15';
    const lookaheadMinutes = parseInt(urlParams.get('ahead') || defaultAhead, 10);
    const isPreview = hasExplicitAhead && lookaheadMinutes !== 15;

    const cycleParam = urlParams.get('cycle');
    const isCycling = cycleParam !== null && cycleParam !== 'false';
    const cycleSeconds = (isCycling && !isNaN(parseInt(cycleParam, 10))) 
      ? Math.max(1, parseInt(cycleParam, 10)) 
      : 10;
    let cycleIndex = 0;

    let nextTransitionTargetEpoch = null;

    function updateClock() {
      const now = new Date();
      document.getElementById('live-clock').textContent = now.toLocaleTimeString([], {
        hour: 'numeric',
        minute: '2-digit',
        hour12: true
      });
      updateCountdown();
    }
    setInterval(updateClock, 1000);
    updateClock();

    function updateCountdown() {
      const countdownBox = document.getElementById('countdown-box');
      const countdownVal = document.getElementById('transition-countdown');
      
      if (!nextTransitionTargetEpoch) {
        countdownBox.classList.remove('is-active');
        return;
      }

      const diffMs = nextTransitionTargetEpoch - Date.now();

      if (diffMs > 0 && diffMs <= 15 * 60 * 1000) {
        const totalSecs = Math.floor(diffMs / 1000);
        const m = Math.floor(totalSecs / 60);
        const s = totalSecs % 60;
        countdownVal.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        countdownBox.classList.add('is-active');
      } else {
        countdownBox.classList.remove('is-active');
      }
    }

    const themeDisplayNames = {
      'theme-tiffany': 'Tiffany',
      'theme-usopen': 'US Open',
      'theme-apple': 'Apple',
      'theme-rolex': 'Rolex',
      'theme-porsche': 'Porsche',
      'theme-rolandgarros': 'Roland-Garros',
      'theme-ausopen': 'Australian Open',
      'theme-vice': 'Miami Vice',
      'theme-gulfracing': 'Gulf Racing',
      'theme-masters': 'Masters',
      'theme-wimbledon': 'Wimbledon',
      'theme-monaco': 'Monaco GP',
      'theme-cyberpunk': 'Tokyo Cyberpunk',
      'theme-ferrari': 'Ferrari Corsa',
      'theme-glacier': 'Nordic Glacier',
      'theme-desertclay': 'Desert Clay',
      'theme-astonmartin': 'Aston Martin AMR',
      'theme-solarflare': 'Solar Flare',
      'theme-stealth': 'Stealth Titanium',
      'theme-lakers': 'Showtime',
      'theme-yankees': 'NY Yankees',
      'theme-mets': 'NY Mets',
      'theme-knicks': 'NY Knicks',
      'theme-nets': 'Brooklyn Nets',
      'theme-liberty': 'NY Liberty',
      'theme-giants': 'NY Giants',
      'theme-jets': 'NY Jets',
      'theme-rangers': 'NY Rangers',
      'theme-islanders': 'NY Islanders',
      'theme-nycfc': 'NYCFC'
    };

    function applyDynamicTheme(targetTime) {
      const allThemes = Object.keys(themeDisplayNames);
      let themeToApply = 'theme-apple';

      if (isCycling) {
        themeToApply = allThemes[cycleIndex % allThemes.length];
      } else {
        const urlTheme = (urlParams.get('theme') || '').toLowerCase().trim();
        if (urlTheme && allThemes.includes(`theme-${urlTheme}`)) {
          themeToApply = `theme-${urlTheme}`;
        } else {
          const totalMinutes = targetTime.getHours() * 60 + targetTime.getMinutes();

          if (totalMinutes >= 420 && totalMinutes < 660) {
            themeToApply = 'theme-tiffany';
          } else if (totalMinutes >= 660 && totalMinutes < 1035) {
            themeToApply = 'theme-usopen';
          } else if (totalMinutes >= 1035 && totalMinutes < 1155) {
            themeToApply = 'theme-apple';
          } else if (totalMinutes >= 1155 && totalMinutes < 1275) {
            themeToApply = 'theme-rolex';
          } else {
            themeToApply = 'theme-porsche';
          }
        }
      }

      document.body.classList.remove(...allThemes);
      document.body.classList.add(themeToApply);

      const displayName = themeDisplayNames[themeToApply] || 'Default';
      const themePill = document.getElementById('theme-pill');
      if (themePill) {
        themePill.textContent = isCycling 
          ? `Theme: ${displayName} (${(cycleIndex % allThemes.length) + 1}/${allThemes.length})` 
          : `Theme: ${displayName}`;
      }
    }

    async function refreshDisplay() {
      try {
        const res = await fetch(`data/schedule.json?_t=${Date.now()}`);
        if (!res.ok) throw new Error("Schedule file not found");
        const data = await res.json();

        const now = new Date();
        document.getElementById('page-refresh-time').textContent = `Display: ${now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true })}`;
        
        if (data.lastUpdated) {
          const syncDate = new Date(data.lastUpdated);
          document.getElementById('data-refresh-time').textContent = `Data Sync: ${syncDate.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: true })}`;
        }

        const targetTime = new Date(now.getTime() + lookaheadMinutes * 60 * 1000);
        const targetTimeString = targetTime.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: true });

        applyDynamicTheme(targetTime);

        document.getElementById('target-mode-pill').textContent = isPreview 
          ? `Target: ${targetTimeString}` 
          : 'Target: Live';

        const isRunningAtTarget = (startIso, endIso) => {
          if (!startIso || !endIso) return false;
          const s = new Date(startIso);
          let e = new Date(endIso);

          if (e.getHours() === 23 && e.getMinutes() === 59) {
            e = new Date(e.getTime() + 61 * 60 * 1000);
          }

          return s <= targetTime && e > targetTime;
        };

        const events = Array.isArray(data) ? data : (data.events || []);

        let closestFutureEpoch = null;
        events.forEach(e => {
          const s = new Date(e.startTime || e.StartTime).getTime();
          let endDt = new Date(e.endTime || e.EndTime);
          if (endDt.getHours() === 23 && endDt.getMinutes() === 59) {
            endDt = new Date(endDt.getTime() + 61 * 60 * 1000);
          }
          const endEpoch = endDt.getTime();

          [s, endEpoch].forEach(epoch => {
            if (epoch > now.getTime()) {
              if (closestFutureEpoch === null || epoch < closestFutureEpoch) {
                closestFutureEpoch = epoch;
              }
            }
          });
        });
        nextTransitionTargetEpoch = closestFutureEpoch;
        updateCountdown();

        const eventMap = {};

        events.forEach(e => {
          if (!isRunningAtTarget(e.startTime, e.endTime)) return;
          const key = `${e.eventId || e.EventId}_${e.startTime || e.StartTime}`;

          const courtNumbers = extractSortedCourts(e.courts || e.Courts);
          const queueInfo = e.paddleQueue || e.PaddleQueue || e.queueText || '';

          if (!eventMap[key]) {
            eventMap[key] = {
              title: cleanTitle(e.title || e.DivisionName || e.EventName || 'Event'),
              startTime: e.startTime || e.StartTime,
              endTime: e.endTime || e.EndTime,
              courts: new Set(courtNumbers),
              queueText: queueInfo
            };
          } else {
            courtNumbers.forEach(c => eventMap[key].courts.add(c));
            if (queueInfo && !eventMap[key].queueText) {
              eventMap[key].queueText = queueInfo;
            }
          }
        });

        const sessions = [];
        Object.values(eventMap).forEach(ev => {
          const resolvedQueue = resolveQueueLocation(ev.courts, ev.queueText);

          sessions.push({
            title: ev.title,
            courtsLabel: formatCourtsLabel(ev.courts, 'index'),
            startTime: ev.startTime,
            endTime: ev.endTime,
            queueText: resolvedQueue
          });
        });

        let bestWindowTag = '';
        if (sessions.length > 0) {
          const windowCounts = {};
          sessions.forEach(item => {
            const w = formatTimeWindow(item.startTime, item.endTime);
            windowCounts[w] = (windowCounts[w] || 0) + 1;
          });
          const bestWindow = Object.keys(windowCounts).reduce((a, b) => windowCounts[a] >= windowCounts[b] ? a : b);
          bestWindowTag = `<span class="header-window">(${bestWindow})</span>`;
        }

        const subtitleText = isPreview 
          ? `Sessions (${targetTimeString} Preview)` 
          : 'Sessions';

        const titleEl = document.getElementById('header-title');
        titleEl.innerHTML = `<span>Welcome to IPX!</span><span class="header-separator">&ndash;</span><span>${subtitleText}</span>${bestWindowTag}`;

        const container = document.getElementById('session-container');
        container.innerHTML = '';

        if (sessions.length === 0) {
          container.className = '';
          container.innerHTML = `
            <div class="no-sessions">
              <h2>No Active Sessions</h2>
            </div>
          `;
          return;
        }

        sessions.sort((a, b) => {
          const keyA = (a.title || '').trim().substring(0, 3);
          const keyB = (b.title || '').trim().substring(0, 3);
          const numA = parseFloat(keyA);
          const numB = parseFloat(keyB);

          if (!isNaN(numA) && !isNaN(numB)) {
            if (numA !== numB) return numA - numB;
          } else {
            const strComp = keyA.localeCompare(keyB, undefined, { numeric: true, sensitivity: 'base' });
            if (strComp !== 0) return strComp;
          }

          return new Date(a.startTime) - new Date(b.startTime);
        });

        const totalSessions = Math.min(sessions.length, 6);
        container.className = `count-${totalSessions}`;

        sessions.forEach(item => {
          let s = new Date(item.startTime);
          let e = new Date(item.endTime);
          if (e.getHours() === 23 && e.getMinutes() === 59) {
            e = new Date(e.getTime() + 61 * 60 * 1000);
          }

          const isNow = now >= s && now <= e;
          const card = document.createElement('div');
          card.className = `session-card ${isNow ? 'is-now' : ''}`;

          card.innerHTML = `
            <div class="session-title">${item.title}</div>
            <div class="session-courts">${item.courtsLabel}</div>
            ${item.queueText ? `<div class="paddle-queue">${item.queueText}</div>` : ''}
          `;

          container.appendChild(card);
        });

      } catch (err) {
        console.error("Error updating sessions display:", err);
      }
    }

    refreshDisplay();
    setInterval(refreshDisplay, 30000);

    if (isCycling) {
      setInterval(() => {
        cycleIndex++;
        const now = new Date();
        const targetTime = new Date(now.getTime() + lookaheadMinutes * 60 * 1000);
        applyDynamicTheme(targetTime);
      }, cycleSeconds * 1000);
    }
  </script>
</body>
</html>
