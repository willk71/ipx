<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Welcome to IPX! &ndash; Court Schedule</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 0%, #1c1c1e 0%, #121214 65%, #000000 100%);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.10);
      --card-border-active: rgba(255, 214, 10, 0.55);

      --yellow: #ffd60a;
      --live-green: #30d158;
      --text-main: #ffffff;
      --text-sub: #ebebf5;
      --text-muted: #8e8e93;

      --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-stack) !important;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 2.2vh 3vw 1.5vh 3vw;
      position: relative;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 1.2vh;
      flex-shrink: 0;
      gap: 2vw;
    }

    .header-left {
      min-width: 0;
      flex: 1;
      display: flex;
      align-items: baseline;
    }

    .header-left h1 {
      font-size: clamp(1.8rem, 2.7vw, 3.2rem);
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text-main);
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: baseline;
    }

    .header-separator {
      margin: 0 0.55em;
      color: var(--text-muted);
      font-weight: 300;
      opacity: 0.7;
    }

    .header-window {
      color: var(--yellow);
      font-weight: 600;
      margin-left: 0.4em;
    }

    .header-right {
      display: flex;
      align-items: baseline;
      gap: 1.2vw;
      flex-shrink: 0;
      text-align: right;
    }

    .clock {
      font-size: clamp(2rem, 3vw, 3.4rem);
      font-weight: 300;
      color: var(--yellow);
      letter-spacing: -0.03em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .date-display {
      font-size: clamp(0.9rem, 1.2vw, 1.3rem);
      color: var(--text-muted);
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1;
      white-space: nowrap;
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 1.6vh 1.6vw;
      margin-top: 1.8vh;
      overflow: hidden;
      min-height: 0;
    }

    .court-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-left: 8px solid var(--yellow);
      border-radius: 16px;
      padding: 1.6vh 1.4vw;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      min-height: 0;
      overflow: hidden;
      position: relative;
    }

    .court-card.is-active {
      border-color: var(--card-border-active);
      box-shadow: 0 0 28px rgba(255, 214, 10, 0.18);
    }

    .court-card.is-empty {
      border-left-color: rgba(255, 255, 255, 0.2);
      opacity: 0.7;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 0.8vh;
      flex-shrink: 0;
    }

    .court-number {
      font-size: clamp(1.4rem, 1.8vw, 2.2rem);
      font-weight: 700;
      color: var(--yellow);
      letter-spacing: -0.02em;
    }

    .status-pill {
      font-size: clamp(0.7rem, 0.8vw, 0.9rem);
      font-weight: 600;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }

    .status-pill.live {
      background: rgba(48, 209, 88, 0.2);
      border: 1px solid rgba(48, 209, 88, 0.5);
      color: #72f08e;
    }

    .status-pill.open {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: var(--text-muted);
    }

    .card-mid {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.4vh;
      min-height: 0;
      padding: 0.8vh 0;
    }

    .session-title {
      font-size: clamp(1.1rem, 1.35vw, 1.65rem);
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.2;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .holder-label {
      font-size: clamp(0.95rem, 1.1vw, 1.3rem);
      color: var(--text-muted);
      font-weight: 400;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty-label {
      font-size: clamp(1.1rem, 1.3vw, 1.5rem);
      color: var(--text-muted);
      font-style: italic;
    }

    .card-bottom {
      flex-shrink: 0;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 0.6vh;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: clamp(0.85rem, 1vw, 1.15rem);
      color: var(--text-sub);
      font-variant-numeric: tabular-nums;
    }

    footer {
      flex-shrink: 0;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 1.2rem;
      padding-top: 0.8vh;
      font-size: 0.75rem;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.35);
      font-variant-numeric: tabular-nums;
    }

    footer span {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <h1 id="header-title">
        <span>Welcome to IPX!</span><span class="header-separator">&ndash;</span><span id="board-subtitle">Court Schedule</span>
      </h1>
    </div>
    <div class="header-right">
      <div class="clock" id="live-clock">--:-- --</div>
      <div class="date-display" id="live-date">Loading...</div>
    </div>
  </header>

  <main id="courts-grid">
    <!-- 8 Courts generated by JS -->
  </main>

  <footer>
    <span id="target-mode-pill">Target: --</span>
    <span>&bull;</span>
    <span id="data-refresh-time">Data Sync: --</span>
    <span>&bull;</span>
    <span id="page-refresh-time">Display Updated: --</span>
  </footer>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const lookaheadMinutes = parseInt(urlParams.get('ahead') || '0', 10);

    function updateClock() {
      const now = new Date();
      document.getElementById('live-clock').textContent = now.toLocaleTimeString([], {
        hour: 'numeric',
        minute: '2-digit',
        hour12: true
      });
      document.getElementById('live-date').textContent = now.toLocaleDateString([], {
        weekday: 'short',
        month: 'short',
        day: 'numeric'
      });
    }
    setInterval(updateClock, 1000);
    updateClock();

    function formatTime(isoString) {
      if (!isoString) return '';
      const d = new Date(isoString);
      return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: true });
    }

    function formatTimeWindow(startIso, endIso) {
      if (!startIso || !endIso) return '';
      const t1 = formatTime(startIso);
      const t2 = formatTime(endIso);
      const parts1 = t1.split(' ');
      const parts2 = t2.split(' ');
      if (parts1.length === 2 && parts2.length === 2 && parts1[1] === parts2[1]) {
        return `${parts1[0]} \u2013 ${t2}`;
      }
      return `${t1} \u2013 ${t2}`;
    }

    function cleanCourtNumber(rawName) {
      if (!rawName) return null;
      const str = String(rawName)
        .replace(/\s*\(\s*Livestreaming\s*\)/gi, '')
        .replace(/\s*\(\s*Streaming\s*\)/gi, '');
      const m = str.match(/\d+/);
      return m ? parseInt(m[0], 10) : null;
    }

    function toSentenceCase(str) {
      if (!str) return '';
      return String(str).replace(/([^\W_]+[^\s-]*) */g, (txt) => {
        return txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase();
      }).trim();
    }

    function cleanTitle(rawTitle) {
      if (!rawTitle) return '';
      let firstSegment = String(rawTitle).split('|')[0].trim();
      firstSegment = firstSegment
        .replace(/\bSessions?\b/gi, '')
        .replace(/\bStrateg(?:ic|y)?(?:\s*(?:Open\s*)?Play)?\b/gi, '')
        .replace(/\bOpen\s*Play\b/gi, '')
        .replace(/\bPrime\s*Time\b/gi, '')
        .replace(/\bStrategic\b/gi, '');

      firstSegment = firstSegment.replace(/[-–—/,\s]+$/, '').trim();
      firstSegment = firstSegment.replace(/(\d+(?:\.\d+)?)\s*[-–—]\s*(\d+(?:\.\d+)?)/g, '$1 \u2013 $2');
      return toSentenceCase(firstSegment);
    }

    async function refreshDisplay() {
      try {
        const res = await fetch(`data/schedule.json?_t=${Date.now()}`);
        if (!res.ok) throw new Error("Schedule file not found");
        const data = await res.json();

        const now = new Date();
        document.getElementById('page-refresh-time').textContent = `Display: ${now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true })}`;
        
        if (data.lastUpdated) {
          const syncDate = new Date(data.lastUpdated);
          document.getElementById('data-refresh-time').textContent = `Data Sync: ${syncDate.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: true })}`;
        }

        const targetTime = new Date(now.getTime() + lookaheadMinutes * 60 * 1000);
        const targetTimeString = targetTime.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: true });

        // Update footer pill
        document.getElementById('target-mode-pill').textContent = lookaheadMinutes !== 0 
          ? `Target: ${targetTimeString}` 
          : 'Target: Now';

        // Update header subtitle with exact preview time instead of "+Xm"
        const subtitleText = lookaheadMinutes !== 0 
          ? `Court Schedule (${targetTimeString} Preview)` 
          : 'Court Schedule';
        document.getElementById('board-subtitle').textContent = subtitleText;

        const isRunningAtTarget = (startIso, endIso) => {
          if (!startIso || !endIso) return false;
          const s = new Date(startIso);
          const e = new Date(endIso);
          return s <= targetTime && e > targetTime;
        };

        // Prepare Court map for Courts 1-8
        const courtMap = {};
        for (let i = 1; i <= 8; i++) {
          courtMap[i] = null;
        }

        // 1. Map Events to Courts
        (data.events || []).forEach(e => {
          if (!isRunningAtTarget(e.startTime, e.endTime)) return;

          let courtsRaw = e.courts || [];
          if (!Array.isArray(courtsRaw)) courtsRaw = [courtsRaw];

          courtsRaw.forEach(c => {
            const num = cleanCourtNumber(c && c.CourtName ? c.CourtName : c);
            if (num && courtMap[num] === null) {
              courtMap[num] = {
                title: cleanTitle(e.title || 'Event'),
                holderLabel: '',
                startTime: e.startTime,
                endTime: e.endTime,
                type: 'event'
              };
            }
          });
        });

        // 2. Map Reservations to Courts
        (data.reservations || []).forEach(r => {
          if (!isRunningAtTarget(r.startTime, r.endTime)) return;

          let courtsRaw = r.court || [];
          if (!Array.isArray(courtsRaw)) courtsRaw = [courtsRaw];

          courtsRaw.forEach(c => {
            const num = cleanCourtNumber(c && c.CourtName ? c.CourtName : c);
            if (num && courtMap[num] === null) {
              courtMap[num] = {
                title: 'Private Reservation',
                holderLabel: r.holderLabel || '',
                startTime: r.startTime,
                endTime: r.endTime,
                type: 'reservation'
              };
            }
          });
        });

        // Render Courts 1 through 8
        const grid = document.getElementById('courts-grid');
        grid.innerHTML = '';

        for (let c = 1; c <= 8; c++) {
          const item = courtMap[c];
          const card = document.createElement('div');
          
          if (item) {
            card.className = 'court-card is-active';
            const windowText = formatTimeWindow(item.startTime, item.endTime);

            card.innerHTML = `
              <div class="card-top">
                <span class="court-number">Court ${c}</span>
                <span class="status-pill live">Live</span>
              </div>
              <div class="card-mid">
                <div class="session-title">${item.title}</div>
                ${item.holderLabel ? `<div class="holder-label">${item.holderLabel}</div>` : ''}
              </div>
              <div class="card-bottom">
                <span>${windowText}</span>
              </div>
            `;
          } else {
            card.className = 'court-card is-empty';
            card.innerHTML = `
              <div class="card-top">
                <span class="court-number">Court ${c}</span>
                <span class="status-pill open">Open</span>
              </div>
              <div class="card-mid">
                <div class="empty-label">Available</div>
              </div>
              <div class="card-bottom">
                <span>&ndash;</span>
              </div>
            `;
          }

          grid.appendChild(card);
        }

      } catch (err) {
        console.error("Error refreshing index display:", err);
      }
    }

    refreshDisplay();
    setInterval(refreshDisplay, 30000);
  </script>
</body>
</html>
