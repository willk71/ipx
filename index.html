<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>IPX Schedule & Courts</title>
  <link rel="stylesheet" href="css/common.css?v=2.2.0" />
</head>
<body class="page-main">
  <header>
    <div class="header-left">
      <h1 id="header-title">
        <span>Welcome to IPX!</span><span class="header-separator">&ndash;</span><span id="board-title-text">Schedule</span>
      </h1>
    </div>
    <div class="header-right">
      <div class="clock" id="live-clock">--:-- --</div>
    </div>
  </header>

  <!-- Court Host Bar -->
  <div id="court-host-bar" class="court-host-container" style="display: none;">
    <span class="host-label" id="host-label-text">Your Court Host:</span>
    <span class="host-names" id="host-names-text">--</span>
  </div>

  <main id="schedule-container">
    <div class="no-sessions">
      <h2>Loading Schedule...</h2>
    </div>
  </main>

  <!-- Private Courts Bar -->
  <div id="private-courts-bar" class="private-courts-container" style="display: none;">
    <span class="private-label">Private Courts:</span>
    <span class="private-courts-list" id="private-courts-text">--</span>
  </div>

  <footer class="main-footer">
    <div class="footer-meta-grid">
      <span id="theme-pill">Theme: --</span>
      <span id="data-refresh-time">Data Sync: --</span>
      <span id="target-mode-pill">Target: --</span>
      <span id="page-refresh-time">Display: --</span>
    </div>
    <div class="footer-right">
      <div class="footer-countdown-container" id="countdown-box">
        <span class="countdown-label">Next session starts:</span>
        <span class="countdown-clock" id="transition-countdown">--:--</span>
      </div>
    </div>
  </footer>

  <script src="js/common.js?v=2.2.0"></script>
  <script>
    async function refreshDisplay() {
      try {
        const res = await fetch(`data/schedule.json?_t=${Date.now()}`);
        if (!res.ok) throw new Error("Schedule file not found");
        const data = await res.json();

        const now = new Date();
        document.getElementById('page-refresh-time').textContent = `Display: ${now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true })}`;
        
        if (data.lastUpdated) {
          const syncDate = new Date(data.lastUpdated);
          document.getElementById('data-refresh-time').textContent = `Data Sync: ${syncDate.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: true })}`;
        }

        const targetTime = new Date(now.getTime() + lookaheadMinutes * 60 * 1000);
        const targetTimeString = targetTime.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: true });

        applyDynamicTheme(targetTime);

        document.getElementById('target-mode-pill').textContent = isPreview 
          ? `Target: ${targetTimeString}` 
          : 'Target: Live';

        const isRunningAtTarget = (startIso, endIso) => {
          if (!startIso || !endIso) return false;
          const s = new Date(startIso);
          let e = new Date(endIso);
          if (e.getHours() === 23 && e.getMinutes() === 59) {
            e = new Date(e.getTime() + 61 * 60 * 1000);
          }
          return s <= targetTime && e > targetTime;
        };

        const events = Array.isArray(data) ? data : (data.events || []);

        // 1. Transition Countdown Target
        let closestFutureEpoch = null;
        events.forEach(e => {
          const rawName = (e.title || e.DivisionName || e.EventName || e.category || '');
          if (/\bRoad\b/i.test(rawName)) return;

          const s = new Date(e.startTime || e.StartTime).getTime();
          let endDt = new Date(e.endTime || e.EndTime);
          if (endDt.getHours() === 23 && endDt.getMinutes() === 59) {
            endDt = new Date(endDt.getTime() + 61 * 60 * 1000);
          }
          const endEpoch = endDt.getTime();

          [s, endEpoch].forEach(epoch => {
            if (epoch > now.getTime()) {
              if (closestFutureEpoch === null || epoch < closestFutureEpoch) {
                closestFutureEpoch = epoch;
              }
            }
          });
        });
        nextTransitionTargetEpoch = closestFutureEpoch;
        updateCountdown();

        // 2. Court Hosts & Private Courts Extraction
        const activeHosts = [];
        const privateCourtNumbers = new Set();

        events.forEach(e => {
          if (!isRunningAtTarget(e.startTime || e.StartTime, e.endTime || e.EndTime)) return;
          const rawTitle = (e.title || e.DivisionName || e.EventName || '');
          const rawCat = (e.category || e.CategoryName || '');

          // Check for Court Host
          if (/court\s*host/i.test(rawTitle) || /court\s*host/i.test(rawCat)) {
            let hostName = e.playerName || 
              (e.FirstName ? `${e.FirstName} ${e.LastName ? e.LastName.charAt(0) : ''}`.trim() : '') ||
              e.MemberName;

            if (!hostName) {
              hostName = cleanTitle(rawTitle).replace(/court\s*host\s*[-–—:]*\s*/i, '').trim();
            }

            if (hostName && !activeHosts.includes(toSentenceCase(hostName))) {
              activeHosts.push(toSentenceCase(hostName));
            }
          }

          // Check for Private Courts / Rentals
          if (/private/i.test(rawTitle) || /private/i.test(rawCat) || /rental/i.test(rawTitle) || /rental/i.test(rawCat)) {
            const courts = extractSortedCourts(e.courts || e.Courts);
            courts.forEach(c => privateCourtNumbers.add(c));
          }
        });

        // Render Court Host Bar
        const hostBar = document.getElementById('court-host-bar');
        const hostLabelText = document.getElementById('host-label-text');
        const hostNamesText = document.getElementById('host-names-text');

        if (activeHosts.length > 0) {
          hostLabelText.textContent = activeHosts.length > 1 ? 'Your Court Hosts:' : 'Your Court Host:';
          hostNamesText.textContent = activeHosts.join(', ');
          hostBar.style.display = 'flex';
        } else {
          hostBar.style.display = 'none';
        }

        // Render Private Courts Bar
        const privateBar = document.getElementById('private-courts-bar');
        const privateText = document.getElementById('private-courts-text');

        if (privateCourtNumbers.size > 0) {
          const sortedPrivates = Array.from(privateCourtNumbers).sort((a, b) => (parseInt(a, 10) || a) - (parseInt(b, 10) || b));
          const prefix = sortedPrivates.length === 1 ? 'Court' : 'Courts';
          privateText.textContent = `${prefix} ${sortedPrivates.join(', ')}`;
          privateBar.style.display = 'flex';
        } else {
          privateBar.style.display = 'none';
        }

        // 3. Regular Session Aggregation
        const sessions = [];
        const eventMap = {};

        events.forEach(e => {
          if (!isRunningAtTarget(e.startTime || e.StartTime, e.endTime || e.EndTime)) return;

          const rawTitle = (e.title || e.DivisionName || e.EventName || '');
          const rawCat = (e.category || e.CategoryName || '');

          // Exclude Road sessions, Court Host entries, and standalone Private rentals from grid cards
          if (/\bRoad\b/i.test(rawTitle) || /court\s*host/i.test(rawTitle) || /court\s*host/i.test(rawCat)) return;
          if (/private/i.test(rawTitle) || /private/i.test(rawCat) || /rental/i.test(rawTitle) || /rental/i.test(rawCat)) return;

          const key = `${e.eventId || e.EventId}_${e.startTime || e.StartTime}`;
          const courtNumbers = extractSortedCourts(e.courts || e.Courts);
          const queueInfo = e.paddleQueue || e.PaddleQueue || e.queueText || '';

          if (!eventMap[key]) {
            eventMap[key] = {
              title: cleanTitle(rawTitle || 'Event'),
              startTime: e.startTime || e.StartTime,
              endTime: e.endTime || e.EndTime,
              courts: new Set(courtNumbers),
              queueText: queueInfo
            };
          } else {
            courtNumbers.forEach(c => eventMap[key].courts.add(c));
            if (queueInfo && !eventMap[key].queueText) {
              eventMap[key].queueText = queueInfo;
            }
          }
        });

        Object.values(eventMap).forEach(ev => {
          const courtsLabel = formatCourtsLabel(ev.courts, 'index');
          const resolvedQueue = resolveQueueLocation(ev.courts, ev.queueText);

          sessions.push({
            title: ev.title,
            courtsLabel: courtsLabel,
            queueLocation: resolvedQueue,
            startTime: ev.startTime,
            endTime: ev.endTime
          });
        });

        let bestWindowTag = '';
        if (sessions.length > 0) {
          const windowCounts = {};
          sessions.forEach(item => {
            const w = formatTimeWindow(item.startTime, item.endTime);
            windowCounts[w] = (windowCounts[w] || 0) + 1;
          });
          const bestWindow = Object.keys(windowCounts).reduce((a, b) => windowCounts[a] >= windowCounts[b] ? a : b);
          bestWindowTag = `<span class="header-window">(${bestWindow})</span>`;
        }

        const subtitleText = isPreview 
          ? `Schedule (${targetTimeString} Preview)` 
          : 'Schedule';

        const titleEl = document.getElementById('header-title');
        titleEl.innerHTML = `<span>Welcome to IPX!</span><span class="header-separator">&ndash;</span><span>${subtitleText}</span>${bestWindowTag}`;

        const container = document.getElementById('schedule-container');
        container.innerHTML = '';

        if (sessions.length === 0) {
          container.className = '';
          container.innerHTML = `
            <div class="no-sessions">
              <h2>No Active Sessions</h2>
            </div>
          `;
          return;
        }

        sessions.sort((a, b) => {
          const keyA = (a.title || '').trim().substring(0, 3);
          const keyB = (b.title || '').trim().substring(0, 3);
          const numA = parseFloat(keyA);
          const numB = parseFloat(keyB);

          if (!isNaN(numA) && !isNaN(numB)) {
            if (numA !== numB) return numA - numB;
          } else {
            const strComp = keyA.localeCompare(keyB, undefined, { numeric: true, sensitivity: 'base' });
            if (strComp !== 0) return strComp;
          }

          return new Date(a.startTime) - new Date(b.startTime);
        });

        const totalSessions = Math.min(sessions.length, 6);
        container.className = `count-${totalSessions}`;

        sessions.forEach(item => {
          const card = document.createElement('div');
          card.className = 'session-card';

          card.innerHTML = `
            <div class="session-title">${item.title}</div>
            <div class="session-courts">${item.courtsLabel}</div>
            ${item.queueLocation ? `<div class="session-queue">${item.queueLocation}</div>` : ''}
          `;
          container.appendChild(card);
        });

      } catch (err) {
        console.error("Error updating schedule display:", err);
      }
    }

    refreshDisplay();
    setInterval(refreshDisplay, 30000);
  </script>
</body>
</html>
