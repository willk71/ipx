<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Welcome to IPX! &ndash; Court Schedule</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 0%, #1c1c1e 0%, #121214 65%, #000000 100%);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.10);
      --card-border-active: rgba(255, 214, 10, 0.55);

      --yellow: #ffd60a;
      --live-green: #30d158;
      --text-main: #ffffff;
      --text-sub: #ebebf5;
      --text-muted: #8e8e93;

      --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-stack) !important;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 2.2vh 3vw 1.5vh 3vw;
      position: relative;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 1.2vh;
      flex-shrink: 0;
      gap: 2vw;
    }

    .header-left {
      min-width: 0;
      flex: 1;
      display: flex;
      align-items: baseline;
    }

    .header-left h1 {
      font-size: clamp(1.8rem, 2.7vw, 3.2rem);
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text-main);
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: baseline;
    }

    .header-separator {
      margin: 0 0.55em;
      color: var(--text-muted);
      font-weight: 300;
      opacity: 0.7;
    }

    .header-window {
      color: var(--yellow);
      font-weight: 600;
      margin-left: 0.4em;
    }

    .header-right {
      display: flex;
      align-items: baseline;
      gap: 1.2vw;
      flex-shrink: 0;
      text-align: right;
    }

    .clock {
      font-size: clamp(2rem, 3vw, 3.4rem);
      font-weight: 300;
      color: var(--yellow);
      letter-spacing: -0.03em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .date-display {
      font-size: clamp(0.9rem, 1.2vw, 1.3rem);
      color: var(--text-muted);
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1;
      white-space: nowrap;
    }

    main {
      flex: 1;
      display: grid;
      gap: 1.6vh 1.6vw;
      margin-top: 1.8vh;
      overflow: hidden;
      min-height: 0;
    }

    main.count-1 { grid-template-columns: 1fr 1fr; }
    main.count-2 { grid-template-columns: 1fr 1fr; }
    main.count-3 { grid-template-columns: 1fr 1fr 1fr; }
    main.count-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
    main.count-5, main.count-6 { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr; }

    .session-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-left: 10px solid var(--yellow);
      border-radius: 18px;
      padding: 2.2vh 2vw;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      min-height: 0;
      overflow: hidden;
    }

    .session-card.single-session {
      grid-column: 1 / 2;
    }

    .session-card.is-now {
      border-color: var(--card-border-active);
      box-shadow: 0 0 35px rgba(255, 214, 10, 0.15);
    }

    .session-card.is-private {
      border-left-color: rgba(255, 255, 255, 0.35);
    }

    .card-top {
      display: flex;
      flex-direction: column;
      gap: 0.8vh;
    }

    .line-title {
      font-size: clamp(1.6rem, 2.2vw, 2.6rem);
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text-main);
      line-height: 1.15;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .line-courts {
      font-size: clamp(1.2rem, 1.6vw, 1.9rem);
      font-weight: 600;
      color: var(--yellow);
      letter-spacing: -0.01em;
    }

    .session-card.is-private .line-courts {
      color: var(--text-sub);
    }

    .holder-tag {
      font-size: clamp(1rem, 1.25vw, 1.45rem);
      color: var(--text-muted);
      font-weight: 400;
      margin-top: 0.2vh;
    }

    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 1.2vh;
      font-variant-numeric: tabular-nums;
    }

    .window-label {
      font-size: clamp(1.05rem, 1.35vw, 1.6rem);
      font-weight: 500;
      color: var(--text-sub);
    }

    .status-badge {
      font-size: clamp(0.75rem, 0.85vw, 0.95rem);
      padding: 0.22rem 0.65rem;
      border-radius: 999px;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .status-badge.live {
      background: rgba(48, 209, 88, 0.2);
      border: 1px solid rgba(48, 209, 88, 0.5);
      color: #72f08e;
    }

    .status-badge.upcoming {
      background: rgba(255, 214, 10, 0.15);
      border: 1px solid rgba(255, 214, 10, 0.4);
      color: var(--yellow);
    }

    .status-badge.private {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: var(--text-muted);
    }

    .no-sessions {
      grid-column: 1 / -1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px dashed rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      text-align: center;
      padding: 6vh;
    }

    .no-sessions h2 {
      font-size: clamp(1.8rem, 2.8vw, 3rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      color: var(--text-sub);
    }

    footer {
      flex-shrink: 0;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 1.2rem;
      padding-top: 0.8vh;
      font-size: 0.75rem;
      font-weight: 400;
      letter-spacing: 0.01em;
      color: rgba(255, 255, 255, 0.35);
      font-variant-numeric: tabular-nums;
    }

    footer span {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <h1 id="header-title">
        <span>Welcome to IPX!</span><span class="header-separator">&ndash;</span><span id="board-subtitle">Schedule</span>
      </h1>
    </div>
    <div class="header-right">
      <div class="clock" id="live-clock">--:-- --</div>
      <div class="date-display" id="live-date">Loading...</div>
    </div>
  </header>

  <main id="schedule-container">
    <div class="no-sessions">
      <h2>Loading Schedule...</h2>
    </div>
  </main>

  <footer>
    <span id="target-mode-pill">Target: --</span>
    <span>&bull;</span>
    <span id="data-refresh-time">Data Sync: --</span>
    <span>&bull;</span>
    <span id="page-refresh-time">Display Updated: --</span>
  </footer>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const lookaheadMinutes = parseInt(urlParams.get('ahead') || '0', 10);

    function updateClock() {
      const now = new Date();
      document.getElementById('live-clock').textContent = now.toLocaleTimeString([], {
        hour: 'numeric',
        minute: '2-digit',
        hour12: true
      });
      document.getElementById('live-date').textContent = now.toLocaleDateString([], {
        weekday: 'short',
        month: 'short',
        day: 'numeric'
      });
    }
    setInterval(updateClock, 1000);
    updateClock();

    function formatTime(isoString) {
      if (!isoString) return '';
      const d = new Date(isoString);
      return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: true });
    }

    function formatTimeWindow(startIso, endIso) {
      if (!startIso || !endIso) return '';
      const t1 = formatTime(startIso);
      const t2 = formatTime(endIso);
      const parts1 = t1.split(' ');
      const parts2 = t2.split(' ');
      if (parts1.length === 2 && parts2.length === 2 && parts1[1] === parts2[1]) {
        return `${parts1[0]} \u2013 ${t2}`;
      }
      return `${t1} \u2013 ${t2}`;
    }

    function cleanCourtName(rawName) {
      if (!rawName) return '';
      return String(rawName)
        .replace(/\s*\(\s*Livestreaming\s*\)/gi, '')
        .replace(/\s*\(\s*Streaming\s*\)/gi, '')
        .replace(/^Court\s*/i, '')
        .trim();
    }

    function toSentenceCase(str) {
      if (!str) return '';
      return String(str).replace(/([^\W_]+[^\s-]*) */g, (txt) => {
        return txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase();
      }).trim();
    }

    function cleanTitle(rawTitle) {
      if (!rawTitle) return '';
      let firstSegment = String(rawTitle).split('|')[0].trim();
      firstSegment = firstSegment
        .replace(/\bSessions?\b/gi, '')
        .replace(/\bStrateg(?:ic|y)?(?:\s*(?:Open\s*)?Play)?\b/gi, '')
        .replace(/\bOpen\s*Play\b/gi, '')
        .replace(/\bPrime\s*Time\b/gi, '')
        .replace(/\bStrategic\b/gi, '');

      firstSegment = firstSegment.replace(/[-–—/,\s]+$/, '').trim();
      firstSegment = firstSegment.replace(/(\d+(?:\.\d+)?)\s*[-–—]\s*(\d+(?:\.\d+)?)/g, '$1 \u2013 $2');
      return toSentenceCase(firstSegment);
    }

    async function refreshDisplay() {
      try {
        const res = await fetch(`data/schedule.json?_t=${Date.now()}`);
        if (!res.ok) throw new Error("Schedule file not found");
        const data = await res.json();

        const now = new Date();
        document.getElementById('page-refresh-time').textContent = `Display: ${now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true })}`;
        
        if (data.lastUpdated) {
          const syncDate = new Date(data.lastUpdated);
          document.getElementById('data-refresh-time').textContent = `Data Sync: ${syncDate.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: true })}`;
        }

        const targetTime = new Date(now.getTime() + lookaheadMinutes * 60 * 1000);
        const targetTimeString = targetTime.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: true });

        // Footer pill
        document.getElementById('target-mode-pill').textContent = lookaheadMinutes !== 0 
          ? `Target: ${targetTimeString}` 
          : 'Target: Now';

        const isRunningAtTarget = (startIso, endIso) => {
          if (!startIso || !endIso) return false;
          const s = new Date(startIso);
          const e = new Date(endIso);
          return s <= targetTime && e > targetTime;
        };

        const sessions = [];

        // 1. Group Events into session cards
        const eventMap = {};
        (data.events || []).forEach(e => {
          if (!isRunningAtTarget(e.startTime, e.endTime)) return;
          const key = `${e.eventId || e.EventId}_${e.startTime || e.StartTime}`;

          let courtsRaw = e.courts || e.Courts || [];
          if (!Array.isArray(courtsRaw)) courtsRaw = [courtsRaw];
          const courtNumbers = courtsRaw
            .map(c => cleanCourtName(c && c.CourtName ? c.CourtName : c))
            .filter(Boolean)
            .sort((a, b) => (parseInt(a) || a) - (parseInt(b) || b));

          if (!eventMap[key]) {
            eventMap[key] = {
              type: 'event',
              title: cleanTitle(e.title || e.DivisionName || e.EventName || 'Event'),
              startTime: e.startTime || e.StartTime,
              endTime: e.endTime || e.EndTime,
              courts: new Set(courtNumbers)
            };
          } else {
            courtNumbers.forEach(c => eventMap[key].courts.add(c));
          }
        });

        Object.values(eventMap).forEach(ev => {
          const arr = Array.from(ev.courts);
          sessions.push({
            type: 'event',
            title: ev.title,
            courtsLabel: arr.length > 0 ? `Courts ${arr.join(', ')}` : 'Courts TBD',
            holderLabel: '',
            startTime: ev.startTime,
            endTime: ev.endTime
          });
        });

        // 2. Private reservations as session cards
        (data.reservations || []).forEach(r => {
          if (!isRunningAtTarget(r.startTime, r.endTime)) return;

          let rawCourt = r.court || r.Courts || r.CourtName || '';
          if (Array.isArray(rawCourt)) rawCourt = rawCourt.map(c => c && c.CourtName ? c.CourtName : c).join(', ');
          const courtClean = cleanCourtName(rawCourt);

          sessions.push({
            type: 'reservation',
            title: 'Private Reservation',
            holderLabel: r.holderLabel || '',
            courtsLabel: courtClean ? `Court ${courtClean}` : 'Court TBD',
            startTime: r.startTime || r.StartTime,
            endTime: r.endTime || r.EndTime
          });
        });

        let bestWindowTag = '';
        if (sessions.length > 0) {
          const windowCounts = {};
          sessions.forEach(item => {
            const w = formatTimeWindow(item.startTime, item.endTime);
            windowCounts[w] = (windowCounts[w] || 0) + 1;
          });
          const bestWindow = Object.keys(windowCounts).reduce((a, b) => windowCounts[a] >= windowCounts[b] ? a : b);
          bestWindowTag = `<span class="header-window">(${bestWindow})</span>`;
        }

        // Subtitle shows target time preview
        const subtitleText = lookaheadMinutes !== 0 
          ? `Schedule (${targetTimeString} Preview)` 
          : 'Schedule';

        const titleEl = document.getElementById('header-title');
        titleEl.innerHTML = `<span>Welcome to IPX!</span><span class="header-separator">&ndash;</span><span>${subtitleText}</span>${bestWindowTag}`;

        const container = document.getElementById('schedule-container');
        container.innerHTML = '';

        if (sessions.length === 0) {
          container.className = '';
          container.innerHTML = `
            <div class="no-sessions">
              <h2>No Scheduled Sessions (${targetTimeString})</h2>
            </div>
          `;
          return;
        }

        // Sort sections lowest to highest by first 3 characters of title
        sessions.sort((a, b) => {
          const keyA = (a.title || '').trim().substring(0, 3);
          const keyB = (b.title || '').trim().substring(0, 3);
          const numA = parseFloat(keyA);
          const numB = parseFloat(keyB);

          if (!isNaN(numA) && !isNaN(numB)) {
            if (numA !== numB) return numA - numB;
          } else {
            const strComp = keyA.localeCompare(keyB, undefined, { numeric: true, sensitivity: 'base' });
            if (strComp !== 0) return strComp;
          }

          return new Date(a.startTime) - new Date(b.startTime);
        });

        const totalSessions = Math.min(sessions.length, 6);
        const isSingle = sessions.length === 1;

        container.className = `count-${totalSessions}`;

        sessions.forEach(item => {
          const s = new Date(item.startTime);
          const e = new Date(item.endTime);
          const isNow = now >= s && now <= e;

          const card = document.createElement('div');
          card.className = `session-card ${isNow ? 'is-now' : ''} ${item.type === 'reservation' ? 'is-private' : ''} ${isSingle ? 'single-session' : ''}`;

          let badgeHtml = '';
          if (isNow) {
            badgeHtml = `<span class="status-badge live">Live Now</span>`;
          } else if (item.type === 'event') {
            badgeHtml = `<span class="status-badge upcoming">Upcoming</span>`;
          } else {
            badgeHtml = `<span class="status-badge private">Private</span>`;
          }

          card.innerHTML = `
            <div class="card-top">
              <div class="line-title">${item.title}</div>
              <div class="line-courts">${item.courtsLabel}</div>
              ${item.holderLabel ? `<div class="holder-tag">${item.holderLabel}</div>` : ''}
            </div>
            <div class="card-bottom">
              <span class="window-label">${formatTimeWindow(item.startTime, item.endTime)}</span>
              ${badgeHtml}
            </div>
          `;
          container.appendChild(card);
        });

      } catch (err) {
        console.error("Error refreshing index display:", err);
      }
    }

    refreshDisplay();
    setInterval(refreshDisplay, 30000);
  </script>
</body>
</html>
