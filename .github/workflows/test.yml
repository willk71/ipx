name: Test Single Member Profile Endpoint

on:
  workflow_dispatch:
    inputs:
      explicit_member_id:
        description: 'Optional: Manually specify an OrganizationMemberId (leave blank to auto-detect)'
        required: false
        default: ''

jobs:
  test-member:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test Member Endpoint Access
        env:
          CR_USER: ${{ secrets.CR_USERNAME }}
          CR_PASS: ${{ secrets.CR_PASSWORD }}
          INPUT_MEMBER_ID: ${{ github.event.inputs.explicit_member_id }}
        run: |
          mkdir -p /tmp/cr_test
          AUTH_HEADER="Basic $(echo -n "${CR_USER}:${CR_PASS}" | base64 -w 0)"

          # 1. Determine Member ID to test
          MEMBER_ID="$INPUT_MEMBER_ID"

          if [ -z "$MEMBER_ID" ]; then
            echo "No explicit ID provided. Pulling an OrganizationMemberId from today's events..."
            TODAY_NY=$(TZ="America/New_York" date +%Y-%m-%d)
            FROM_UTC=$(date -u -d "${TODAY_NY} 00:00:00 EDT" +%Y-%m-%dT%H:%M:%SZ)
            TO_UTC=$(date -u -d "${TODAY_NY} 23:59:59 EDT" +%Y-%m-%dT%H:%M:%SZ)

            EVENT_URL="https://api.courtreserve.com/api/v1/eventregistrationreport/listactive?eventDateFrom=${FROM_UTC}&eventDateTo=${TO_UTC}&includeCourts=true"
            curl -s -H "Authorization: $AUTH_HEADER" -H "Accept: application/json" "$EVENT_URL" -o /tmp/cr_test/events.json

            MEMBER_ID=$(python3 -c '
          import json, os
          try:
              with open("/tmp/cr_test/events.json") as f:
                  data = json.load(f)
              items = data.get("Data", data) if isinstance(data, dict) else data
              for item in items:
                  m_id = item.get("OrganizationMemberId")
                  if m_id:
                      print(m_id)
                      break
          except Exception:
              pass
          ')
          fi

          if [ -z "$MEMBER_ID" ]; then
            echo "ERROR: Could not find an OrganizationMemberId to test. Run with an explicit ID or verify today has active events."
            rm -rf /tmp/cr_test
            exit 1
          fi

          echo "Testing with OrganizationMemberId: $MEMBER_ID"

          # 2. Query CourtReserve Member Details API
          # We test both common query styles (memberId and id)
          MEMBER_URL="https://api.courtreserve.com/api/v1/members/details?memberId=${MEMBER_ID}"
          echo "Calling: $MEMBER_URL"

          HTTP_STATUS=$(curl -s -w "%{http_code}" \
            -H "Authorization: $AUTH_HEADER" \
            -H "Accept: application/json" \
            "$MEMBER_URL" \
            -o /tmp/cr_test/member.json)

          echo "Response HTTP Status: $HTTP_STATUS"

          # 3. Inspect Results Safely (Sanitizing PII)
          python3 - << EOF
          import json, os

          filepath = '/tmp/cr_test/member.json'
          if not os.path.exists(filepath):
              print("No response file generated.")
              exit(0)

          status = "$HTTP_STATUS"
          if status in ['401', '403']:
              print(f"\n[RESULT]: HTTP {status} Access Denied. The API account does NOT have permission to view member profiles or member custom fields.")
              exit(0)
          elif status != '200':
              print(f"\n[RESULT]: Endpoint returned unexpected status {status}.")
              with open(filepath, 'r') as f:
                  print(f.read()[:300])
              exit(0)

          with open(filepath, 'r') as f:
              try:
                  data = json.load(f)
              except Exception as e:
                  print(f"Could not parse response as JSON: {e}")
                  exit(0)

          member_obj = data.get('Data', data) if isinstance(data, dict) else data
          print("\n[RESULT]: HTTP 200 OK! Member profile endpoint is accessible.\n")

          # Print available top-level keys
          if isinstance(member_obj, dict):
              print("Available keys on Member object:")
              print(list(member_obj.keys()))
              print("-" * 50)

              # Check Ratings
              if 'Ratings' in member_obj and member_obj['Ratings']:
                  print("Found Ratings:")
                  print(json.dumps(member_obj['Ratings'], indent=2))

              # Check CustomFields / MemberUserDefinedFields
              for k in ['CustomFields', 'MemberUserDefinedFields', 'UserDefinedFields']:
                  if k in member_obj and member_obj[k]:
                      print(f"Found {k}:")
                      print(json.dumps(member_obj[k], indent=2))

              # Check for any rating-related keys
              rating_keys = {k: v for k, v in member_obj.items() if 'dupr' in k.lower() or 'rating' in k.lower()}
              if rating_keys:
                  print(f"Found direct rating keys: {rating_keys}")
          else:
              print(f"Unexpected data format: {type(member_obj)}")
          EOF

          # 4. Immediate Cleanup
          rm -rf /tmp/cr_test
