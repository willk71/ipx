name: Fetch Court Reservations

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-sanitize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pytz requests

      - name: Run Sanitizer Script
        env:
          COURTRESERVE_AUTH: ${{ secrets.COURTRESERVE_AUTH }}
        run: |
          python scripts/fetch_schedule.py

      - name: Commit and push sanitized schedule
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/schedule.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update sanitized schedule [skip ci]" && git push)
