name: Sync CourtReserve Schedule

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and process CourtReserve data
        env:
          CR_USERNAME: ${{ secrets.CR_USERNAME }}
          CR_PASSWORD: ${{ secrets.CR_PASSWORD }}
        run: |
          mkdir -p data

          # Compute America/New_York relative dates formatted for CourtReserve API
          START_DATE=$(date -u -d "4 hours ago" +"%Y-%m-%dT%H:%M:%S")
          END_DATE=$(date -u -d "16 hours" +"%Y-%m-%dT%H:%M:%S")
          AUTH_HEADER="Basic $(echo -n "${CR_USERNAME}:${CR_PASSWORD}" | base64 -w 0)"

          echo "Fetching Reservations from $START_DATE to $END_DATE..."
          HTTP_RES=$(curl -s -w "%{http_code}" -X GET "https://api.courtreserve.com/api/v1/reservationreport/listactive?startDateTime=${START_DATE}&endDateTime=${END_DATE}" \
            -H "Authorization: ${AUTH_HEADER}" \
            -H "Accept: application/json" -o raw_reservations.json)

          echo "Fetching Events from $START_DATE to $END_DATE..."
          HTTP_EV=$(curl -s -w "%{http_code}" -X GET "https://api.courtreserve.com/api/v1/eventregistrationreport/listactive?startDateTime=${START_DATE}&endDateTime=${END_DATE}" \
            -H "Authorization: ${AUTH_HEADER}" \
            -H "Accept: application/json" -o raw_events.json)

          echo "HTTP Responses: Reservations=$HTTP_RES, Events=$HTTP_EV"

          # If either API call failed with a non-200 code, abort so we don't wipe existing schedule
          if [ "$HTTP_RES" != "200" ] && [ "$HTTP_EV" != "200" ]; then
            echo "CourtReserve API error (HTTP $HTTP_RES / $HTTP_EV). Preserving previous data."
            exit 0
          fi

          # Merge, scrub PII, and generate data/schedule.json
          jq -n \
            --arg now "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            --slurpfile res raw_reservations.json \
            --slurpfile ev raw_events.json \
            '
            def get_items(input_data):
              if (input_data | type) == "array" then input_data
              elif (input_data | type) == "object" then (input_data.Data // input_data.Items // input_data.data // input_data.items // [])
              else []
              end;

            def scrub_holder:
              if ((.MemberFirstName // .FirstName // .UserFirstName // "") != "" and (.MemberLastName // .LastName // .UserLastName // "") != "") then
                ("(" + (.MemberFirstName // .FirstName // .UserFirstName) + " " + ((.MemberLastName // .LastName // .UserLastName)[0:1]) + ")")
              elif ((.MemberName // .UserName // .ReservedBy // .OwnerName // "") != "") then
                ((.MemberName // .UserName // .ReservedBy // .OwnerName) | 
                  if contains(",") then
                    (split(",") | [.[1] | ltrimstr(" ") | rtrimstr(" "), .[0] | ltrimstr(" ") | rtrimstr(" ")]) |
                    if (.[0] != "" and .[1] != "") then "(" + .[0] + " " + .[1][0:1] + ")" else "(" + .[0] + ")" end
                  else
                    (split(" ") | map(select(length > 0))) |
                    if length > 1 then
                      "(" + .[0] + " " + .[-1][0:1] + ")"
                    elif length == 1 then
                      "(" + .[0] + ")"
                    else
                      ""
                    end
                  end
                )
              elif (.Member.FirstName? and .Member.LastName?) then
                ("(" + .Member.FirstName + " " + (.Member.LastName[0:1]) + ")")
              elif (.Member.Name?) then
                (.Member.Name | split(" ") | "(" + .[0] + " " + .[-1][0:1] + ")")
              else
                ""
              end;

            {
              lastUpdated: $now,
              reservations: [
                get_items($res[0])[] | select(type == "object" and ((.ReservationId // .Id) != null)) | {
                  reservationId: (.ReservationId // .Id),
                  court: (.CourtName // .Courts // .Court // "TBD"),
                  startTime: (.StartTime // .ReservationStartTime),
                  endTime: (.EndTime // .ReservationEndTime),
                  holderLabel: scrub_holder
                }
              ],
              events: [
                get_items($ev[0])[] | select(type == "object" and ((.EventId // .Id) != null)) | {
                  eventId: (.EventId // .Id),
                  title: (.EventName // .DivisionName // .Title // "Event"),
                  startTime: (.StartTime // .EventStartTime),
                  endTime: (.EndTime // .EventEndTime),
                  courts: (.Courts // .CourtName // []),
                  playerName: (
                    if ((.MemberFirstName // .FirstName // "") != "" and (.MemberLastName // .LastName // "") != "") then
                      ((.MemberFirstName // .FirstName) + " " + ((.MemberLastName // .LastName)[0:1]))
                    elif ((.MemberName // "") != "") then
                      ((.MemberName | split(" ")) | if length > 1 then .[0] + " " + .[-1][0:1] else .[0] end)
                    else
                      null
                    end
                  )
                }
              ]
            }' > data/schedule.json.tmp

          # Only replace schedule.json if the temporary file contains valid JSON
          if jq . data/schedule.json.tmp >/dev/null 2>&1; then
            mv data/schedule.json.tmp data/schedule.json
          else
            echo "Invalid JSON generated, keeping previous schedule.json"
            rm -f data/schedule.json.tmp
          fi

          rm -f raw_reservations.json raw_events.json

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/schedule.json
          if git diff --staged --quiet; then
            echo "No schedule changes detected."
          else
            git commit -m "Automated schedule sync: $(date -u +'%Y-%m-%d %H:%M:%SZ')"
            git push
          fi
