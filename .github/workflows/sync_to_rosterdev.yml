name: Sync to roster-dev

on:
  workflow_dispatch: # Only triggers manually via the GitHub Actions tab

jobs:
  repo-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ipx repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full history so branches push cleanly

      - name: Push to roster-dev
        env:
          DEST_REPO: "github.com/${{ github.repository_owner }}/roster-dev.git"
          SYNC_TOKEN: ${{ secrets.PAT_ROSTER_DEV }}
        run: |
          git push https://${SYNC_TOKEN}@${DEST_REPO} main:main --force
