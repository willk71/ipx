name: Auto Sync CourtReserve

on:
  workflow_dispatch:

concurrency:
  group: sync-courtreserve
  cancel-in-progress: false

jobs:
  sync-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Calendar Dependency
        run: |
          python3 -m pip install --quiet --no-cache-dir icalendar pytz

      - name: Run Cadence Sync Loop
        env:
          CR_USER: ${{ secrets.CR_USERNAME }}
          CR_PASS: ${{ secrets.CR_PASSWORD }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          cat << 'PY_SCRIPT' > /tmp/parse_hosts.py
          import datetime, json, os, pytz, re
          from icalendar import Calendar

          tz = pytz.timezone('America/New_York')
          now_ny = datetime.datetime.now(tz)
          today_ny = now_ny.date()

          hosts = []
          overrides = []
          ad_hoc = []

          def parse_courts(raw_str):
              clean_nums = re.sub(r'^(?:override\s*:?|\+?\s*courts?|on)\s*', '', raw_str, flags=re.I)
              courts = []
              for chunk in clean_nums.split(','):
                  chunk = chunk.strip()
                  if '-' in chunk:
                      r_parts = chunk.split('-')
                      if len(r_parts) == 2 and r_parts[0].strip().isdigit() and r_parts[1].strip().isdigit():
                          for n in range(int(r_parts[0]), int(r_parts[1]) + 1):
                              courts.append(str(n))
                  else:
                      digits = re.findall(r'\d+', chunk)
                      courts.extend(digits)
              return list(dict.fromkeys(courts))

          if os.path.exists('data/hosts.ics'):
              with open('data/hosts.ics', 'rb') as f:
                  cal = Calendar.from_ical(f.read())
                  for component in cal.walk('vevent'):
                      dtstart_prop = component.get('dtstart')
                      dtend_prop = component.get('dtend')
                      if not dtstart_prop:
                          continue

                      dtstart = dtstart_prop.dt
                      dtend = dtend_prop.dt if dtend_prop else dtstart
                      summary = str(component.get('summary', '')).strip()

                      if isinstance(dtstart, datetime.datetime):
                          if dtstart.tzinfo is None:
                              dtstart = pytz.utc.localize(dtstart)
                          dtstart = dtstart.astimezone(tz)
                          if isinstance(dtend, datetime.datetime):
                              if dtend.tzinfo is None:
                                  dtend = pytz.utc.localize(dtend)
                              dtend = dtend.astimezone(tz)

                          if dtstart.date() == today_ny:
                              if re.match(r'^(?:court\s+hosts?:?|hosts?:?)\b', summary, re.I):
                                  clean_title = re.sub(r'^(?:court\s+hosts?:?|hosts?:?)\s*', '', summary, flags=re.I).strip()
                                  names = [n.strip() for n in re.split(r'[,/&]|\b(?<!\w)and(?!\w)\b', clean_title) if n.strip()]
                                  for name in names:
                                      if not re.search(r'(\bcourts?\b|\bintermediate\b|\badvanced\b|\bbeginner\b|\bopen\s*play\b)', name, re.I):
                                          hosts.append({
                                              'start': dtstart.strftime('%H:%M'),
                                              'end': dtend.strftime('%H:%M'),
                                              'host': name
                                          })
                                  continue

                              if re.match(r'^(?:override\s*:?|\+?\s*courts?)\b', summary, re.I):
                                  match_filter = ""
                                  court_str = summary
                                  if '|' in summary:
                                      parts = summary.split('|', 1)
                                      court_str = parts[0].strip()
                                      match_filter = parts[1].strip()

                                  courts = parse_courts(court_str)
                                  if courts:
                                      overrides.append({
                                          'start': dtstart.strftime('%H:%M'),
                                          'end': dtend.strftime('%H:%M'),
                                          'courts': courts,
                                          'match': match_filter
                                      })
                                  continue

                              clean_ad_hoc = re.sub(r'^session\s*:?\s*', '', summary, flags=re.I).strip()
                              session_title = clean_ad_hoc
                              session_courts = []

                              if '|' in clean_ad_hoc:
                                  parts = clean_ad_hoc.split('|', 1)
                                  session_title = parts[0].strip()
                                  session_courts = parse_courts(parts[1].strip())
                              elif re.search(r'\b(?:on|courts?)\s+\d', clean_ad_hoc, re.I):
                                  match_on = re.split(r'\b(?:on|courts?)\b', clean_ad_hoc, flags=re.I)
                                  if len(match_on) >= 2:
                                      session_title = match_on[0].strip()
                                      session_courts = parse_courts(match_on[1].strip())

                              if session_title and session_courts:
                                  ad_hoc.append({
                                      'title': session_title,
                                      'start': dtstart.strftime('%H:%M'),
                                      'end': dtend.strftime('%H:%M'),
                                      'startTimeIso': dtstart.isoformat(),
                                      'endTimeIso': dtend.isoformat(),
                                      'courts': session_courts
                                  })

          with open('data/hosts.json', 'w') as out:
              json.dump({'hosts': hosts, 'overrides': overrides, 'adHoc': ad_hoc}, out)
          PY_SCRIPT

          sync_pass() {
            echo "=== Starting CourtReserve Schedule Sync ==="

            git fetch origin main --quiet
            git reset --hard origin/main --quiet

            mkdir -p data
            rm -f data/.choices_fresh
            TODAY_NY=$(TZ="America/New_York" date +%Y-%m-%d)
            FROM_UTC=$(date -u -d "-12 hours" +%Y-%m-%dT%H:%M:%SZ)
            TO_UTC=$(date -u -d "+24 hours" +%Y-%m-%dT%H:%M:%SZ)
            AUTH_HEADER="Basic $(echo -n "${CR_USER}:${CR_PASS}" | base64 -w 0)"
            USER_AGENT="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"

            RES_URL="https://api.courtreserve.com/api/v1/reservationreport/listactive?reservationsFromDate=${FROM_UTC}&reservationsToDate=${TO_UTC}"
            curl -s -A "$USER_AGENT" --connect-timeout 10 --max-time 25 -H "Authorization: $AUTH_HEADER" -H "Accept: application/json" "$RES_URL" -o data/reservations.json

            EVENT_URL="https://api.courtreserve.com/api/v1/eventregistrationreport/listactive?eventDateFrom=${FROM_UTC}&eventDateTo=${TO_UTC}&includeCourts=true&includePartnerInfo=true&includeGuests=true"
            curl -s -A "$USER_AGENT" --connect-timeout 10 --max-time 25 -H "Authorization: $AUTH_HEADER" -H "Accept: application/json" "$EVENT_URL" -o data/events.json

            # Pull 10-day lookahead on ~9 min cadence (0, 9, 18, 27, 36, 45, 54) to conserve API & KV writes
            CURRENT_MIN=$(TZ="America/New_York" date +%-M)
            if [ $(( CURRENT_MIN % 9 )) -eq 0 ] || [ "${FORCE_CHOICES:-false}" = "true" ]; then
              echo "Cadence check (${CURRENT_MIN}m): Pulling 10-day event registrations for choice tallies (including 48h lookback)..."
              FROM_CHOICES_UTC=$(date -u -d "-48 hours" +%Y-%m-%dT%H:%M:%SZ)
              TO_10D_UTC=$(date -u -d "+10 days" +%Y-%m-%dT%H:%M:%SZ)
              EVENT_10D_URL="https://api.courtreserve.com/api/v1/eventregistrationreport/listactive?eventDateFrom=${FROM_CHOICES_UTC}&eventDateTo=${TO_10D_UTC}&includeCourts=true&includePartnerInfo=true&includeGuests=true&includeUserDefinedFields=true"
              curl -s -A "$USER_AGENT" --connect-timeout 10 --max-time 35 -H "Authorization: $AUTH_HEADER" -H "Accept: application/json" "$EVENT_10D_URL" -o data/events_10d.json
              python3 Scripts/parse_event_choices.py && touch data/.choices_fresh || echo "Warning: parse_event_choices failed"
              rm -f data/events_10d.json
            else
              echo "Cadence check (${CURRENT_MIN}m): Skipping 10-day choices (runs every ~9m on :00, :09, :18, :27, :36, :45, :54)."
            fi

            CHECKIN_URL="https://api.courtreserve.com/api/v1/attendancereport/checkin?checkInStartDate=${TODAY_NY}&includeCourtBooking=true&includeEvents=true"
            curl -s -A "$USER_AGENT" --connect-timeout 10 --max-time 25 -H "Authorization: $AUTH_HEADER" -H "Accept: application/json" "$CHECKIN_URL" -o data/checkins.json

            CAL_URL="https://calendar.google.com/calendar/ical/67069501837f4d35e345182e4976e9e0020175f757df0990999d7f6080495146%40group.calendar.google.com/public/basic.ics"
            curl -sL -A "$USER_AGENT" --connect-timeout 10 --max-time 25 "$CAL_URL" -o data/hosts.ics

            # Validate JSON responses before processing
            if ! jq empty data/reservations.json 2>/dev/null; then
              echo "Error: data/reservations.json is not valid JSON. Response preview:"
              head -n 10 data/reservations.json
              return 1
            fi
            if ! jq empty data/events.json 2>/dev/null; then
              echo "Error: data/events.json is not valid JSON. Response preview:"
              head -n 10 data/events.json
              return 1
            fi
            if ! jq empty data/checkins.json 2>/dev/null; then
              echo "Error: data/checkins.json is not valid JSON. Response preview:"
              head -n 10 data/checkins.json
              return 1
            fi

            python3 /tmp/parse_hosts.py
            [ ! -f data/hosts.json ] && echo '{"hosts":[],"overrides":[],"adHoc":[]}' > data/hosts.json

            jq -n \
              --slurpfile res data/reservations.json \
              --slurpfile ev data/events.json \
              --slurpfile chk data/checkins.json \
              --slurpfile extra data/hosts.json \
              '{
                lastUpdated: (now | todate),
                date: "'"$TODAY_NY"'",
                courtHosts: ($extra[0].hosts // []),
                courtOverrides: ($extra[0].overrides // []),
                adHocSessions: ($extra[0].adHoc // []),
                reservations: [
                  ($res[0].Data // $res[0] // [])[] | {
                    court: (.Courts // .CourtName // ""),
                    holderLabel: (
                      if (.MemberFirstName and .MemberLastName) then
                        ((.MemberFirstName | split(" ")[0]) + " " + (.MemberLastName[0:1]) + ".")
                      elif .FirstName then
                        ((.FirstName | split(" ")[0]) + (if .LastName then " " + (.LastName[0:1]) + "." else "" end))
                      elif .MemberName then
                        ((.MemberName | split(" ")[0]) + " " + ((.MemberName | split(" ")[1] // "")[0:1]) + ".")
                      elif .ReservedBy then
                        ((.ReservedBy | split(" ")[0]) + " " + ((.ReservedBy | split(" ")[1] // "")[0:1]) + ".")
                      elif (.Member and .Member.FirstName) then
                        ((.Member.FirstName | split(" ")[0]) + " " + ((.Member.LastName // "")[0:1]) + ".")
                      elif (.Players and (.Players | length > 0)) then
                        ((.Players[0].FirstName // .Players[0].MemberFirstName // "Reserved") | split(" ")[0]) + 
                        (if (.Players[0].LastName // .Players[0].MemberLastName) then " " + ((.Players[0].LastName // .Players[0].MemberLastName)[0:1]) + "." else "" end)
                      else "" end
                    ),
                    startTime: .StartTime,
                    endTime: .EndTime
                  }
                ],
                events: (
                  (($chk[0].Data // $chk[0] // []) | reduce .[] as $item ({};
                    if ($item.CheckInStatusName == "Checked-in" or ($item.CheckinDateTime != null and $item.CheckinDateTime != "")) then
                      (if ($item.OrganizationMemberId // "") != "" then .["id:" + ($item.OrganizationMemberId | tostring)] = true else . end) |
                      (
                        ((($item.MemberFirstName // $item.FirstName // "") + " " + ($item.MemberLastName // $item.LastName // ""))
                        | gsub("\\s*\\([^)]*\\)"; "") | gsub("^\\s+|\\s+$"; "") | ascii_downcase) as $cleanName |
                        if $cleanName != "" then .["name:" + $cleanName] = true else . end
                      )
                    else . end
                  )) as $checkedMap |

                  [
                    ($ev[0].Data // $ev[0] // [])[] |
                    select(.IsPublic != false and .IsHidden != true) |
                    select((.EventName // .DivisionName // "") | test("\\b(hosts?|guests?)\\b"; "i") | not) |
                    select([.Courts[]? | (.CourtName // . // "") | tostring | test("\\b(hosts?|guests?)\\b"; "i")] | any | not) |
                    (
                      (((.FirstName // .MemberFirstName // "") + " " + (.LastName // .MemberLastName // ""))
                      | gsub("\\s*\\([^)]*\\)"; "") | gsub("^\\s+|\\s+$"; "") | ascii_downcase)
                    ) as $playerCleanName |
                    {
                      eventId: .EventId,
                      title: (
                        (.DivisionName // .EventName // "Event")
                        | gsub("^\\s*Play\\s*(til|until|till)\\s*1(:00)?\\s*am\\s*[-–—|:]*\\s*"; ""; "i")
                        | gsub("\\s*\\(\\s*Play\\s*(til|until|till)\\s*1(:00)?\\s*am\\s*\\)"; ""; "i")
                        | gsub("\\s*[-–—|/]\\s*Play\\s*(til|until|till)\\s*1(:00)?\\s*am\\b"; ""; "i")
                        | gsub("\\bPlay\\s*(til|until|till)\\s*1(:00)?\\s*am\\b"; ""; "i")
                        | gsub("\\s*[-–—|/:]\\s*$"; "")
                        | gsub("^[\\s\\-–—|/:]+"; "")
                      ),
                      startTime: .StartTime,
                      endTime: .EndTime,
                      courts: (if .Courts then [(.Courts[]?.CourtName // .Courts[]? // empty)] else [] end),
                      playerName: (
                        if .FirstName then
                          ((.FirstName | split(" ")[0]) + (if .LastName then " " + (.LastName[0:1]) else "" end))
                        elif .MemberName then
                          ((.MemberName | split(" ")[0]) + " " + ((.MemberName | split(" ")[1] // "")[0:1]))
                        else "" end
                      ),
                      checkedIn: (
                        (if (.OrganizationMemberId // "") != "" then ($checkedMap["id:" + (.OrganizationMemberId | tostring)] // false) else false end) or
                        ($checkedMap["name:" + $playerCleanName] // false)
                      )
                    }
                  ]
                )
              }' > data/schedule.json

            python3 Scripts/split_choice_events.py || echo "Warning: split_choice_events failed"
            python3 Scripts/upload_to_kv.py || echo "Warning: upload_to_kv failed" 

            rm -f data/reservations.json data/events.json data/checkins.json data/hosts.ics data/hosts.json data/schedule.json data/event-choices.json data/cr_api_discovery.json data/.choices_fresh
            echo "Live schedule synced to Cloudflare KV successfully (0 git commits)."
          }

          sync_pass
